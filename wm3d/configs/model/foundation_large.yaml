schema: wm3d_v8_model_profile_v1
name: foundation_large_wan_grouped_robot
architecture: foundation_world_model
sampling:
  mode: observed_monotonic_subsequence
  history_action_leading_boundary: observed_previous_state
  context_horizon_seconds: 3.2
  future_horizon_seconds: 1.6
  minimum_horizon_coverage: 0.9
  minimum_anchor_separation_seconds: 0.2
  policy_target_horizon_seconds: 1.6
  policy_training_times: observed_action_timestamps
  interpolation: forbidden
model:
  schema: wm3d_foundation_world_model_v1
  T: 16
  P: 64
  K: 8
  token_dim: 2048
  task_dim: 2048
  num_views: 3
  max_action_groups: 3
  max_action_dim: 14
  max_state_dim: 10
  # Storage ceilings only: native command rates are preserved exactly and the
  # collator trims each source-homogeneous batch to its observed extent.
  max_action_substeps: 128
  max_policy_queries: 256
  max_group_id: 128
  max_embodiments: 512
  max_action_semantic_id: 64
  max_state_semantic_id: 64
  max_aux_tokens: 1
  aux_dim: 1
  rgb_size: 256
  rgb_decode_indices: [0, 1, 2, 3, 4, 5, 6, 7]
  # Hierarchical native-3D capacity: P144 is already the released WSA
  # Future3D query grid per view. K8 dynamics are decoded at P64, while the
  # released P1296 final-state output head remains intact.
  native_3d_context_tokens: 144
  native_3d_rollout_tokens: 64
  native_3d_target_tokens: 144
  video_height: 384
  video_width: 320
  wsa_text_dim: 4096
  context_fusion_heads: 16
  robot_conditioning_hidden: 256
  action_time_fourier_dim: 64
  wsa_action_horizon: 32
  upstream_source_root: /data/Minko/third_party/WSA
  wsa_pretrained_path: /data/Minko/models/WSA-Large
  wan_model_path: /data/Minko/models/Wan2.2-TI2V-5B
  wan_tokenizer_model_path: /data/Minko/models/Wan2.2-TI2V-5B
  wan_context_store_path: /data/Minko/wm3d_foundation_context
  video_loss_weight: 1.0
  action_loss_weight: 1.0
  native_3d_loss_weight: 0.05
  native_3d_rollout_loss_weight: 0.05
  activation_checkpointing: true
  dtype: bf16

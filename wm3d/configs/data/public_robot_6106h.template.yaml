embodiments:
  - name: droid_single_arm
    embodiment_id: 1
    groups:
      - name: arm
        group_id: 1
        action_semantics: [delta_position_m, delta_position_m, delta_position_m, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, absolute_gripper_open01]
        state_semantics: [eef_position_m, eef_position_m, eef_position_m, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, gripper_close01]
        action_frame: robot_base
        state_frame: robot_base
        composition_operators: [sum, sum, sum, so3_axis_angle_base_left, so3_axis_angle_base_left, so3_axis_angle_base_left, logical_last]
  - name: bridge_single_arm
    embodiment_id: 2
    groups:
      - name: arm
        group_id: 2
        action_semantics: [delta_position_m, delta_position_m, delta_position_m, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, absolute_gripper_open01]
        state_semantics: [eef_position_m, eef_position_m, eef_position_m, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, gripper_close01]
        action_frame: robot_base
        state_frame: robot_base
        composition_operators: [sum, sum, sum, so3_axis_angle_base_left, so3_axis_angle_base_left, so3_axis_angle_base_left, logical_last]
  - name: robocasa_mobile_single_arm
    embodiment_id: 3
    groups:
      - name: base
        group_id: 10
        # RoboCasa 原始 action[0:4] 四维全部保留。它们的具体控制语义必须由
        # source audit receipt 绑定；在审计完成前不得假装成三维 base velocity。
        action_semantics: [controller_command, controller_command, controller_command, controller_command]
        state_semantics: [base_pose, base_pose, base_pose]
        action_frame: robot_base
        state_frame: world
        composition_operators: [last, last, last, last]
      - name: controller_mode
        group_id: 11
        # 原始 action[4] 是动作有效性/控制模式通道；不能在扩大数据时被丢弃。
        action_semantics: [controller_mode]
        state_semantics: []
        action_frame: controller_native
        state_frame: controller_native
        composition_operators: [logical_last]
      - name: arm
        group_id: 12
        action_semantics: [delta_position_m, delta_position_m, delta_position_m, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, absolute_gripper_open01]
        state_semantics: [eef_position_m, eef_position_m, eef_position_m, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, gripper_close01]
        action_frame: robot_base
        state_frame: robot_base
        composition_operators: [sum, sum, sum, so3_axis_angle_base_left, so3_axis_angle_base_left, so3_axis_angle_base_left, logical_last]
  - name: agibot_bimanual_wholebody
    embodiment_id: 4
    groups:
      - name: left_arm
        group_id: 20
        action_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, absolute_gripper_open01]
        state_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, gripper_close01]
        action_frame: left_joint_space
        state_frame: left_joint_space
        composition_operators: [last, last, last, last, last, last, last, logical_last]
      - name: right_arm
        group_id: 21
        action_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, absolute_gripper_open01]
        state_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, gripper_close01]
        action_frame: right_joint_space
        state_frame: right_joint_space
        composition_operators: [last, last, last, last, last, last, last, logical_last]
      - name: base
        group_id: 22
        action_semantics: [base_velocity_mps, base_yaw_rate_rps]
        state_semantics: [base_pose, base_pose, base_velocity, base_velocity]
        action_frame: robot_base
        state_frame: world
        composition_operators: [time_weighted_mean, time_weighted_mean]
      - name: waist
        group_id: 23
        action_semantics: [joint_position_rad, joint_position_rad]
        state_semantics: [joint_position_rad, joint_position_rad]
        action_frame: waist_joint_space
        state_frame: waist_joint_space
        composition_operators: [last, last]
      - name: head
        group_id: 24
        action_semantics: [joint_position_rad, joint_position_rad]
        state_semantics: [joint_position_rad, joint_position_rad]
        action_frame: head_joint_space
        state_frame: head_joint_space
        composition_operators: [last, last]

notes:
  nominal_total_hours: 6106.4
  profile_role: expanded_optional_profile_not_legacy_compatible
  formal_target_unique_hours: 5000-8000
  cadence_contract: state/action 均保留 source-native 时间戳，不做全局 5Hz/20Hz/30Hz 重采样
  adapter_contract: 所有 action/state 字段、单位、坐标系和维度必须由 source audit receipt 实测封存；上面的 AgiBot group 只是采购容量候选，首次 schema audit 后必须人工确认或改正，模板本身不能进入正式训练

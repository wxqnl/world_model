schema: wm3d_v8_data_profile_v4
name: public_robot_oxe_no_beta

cache_representation:
  schema: wm3d_v8_episode_representation_v1
  token_grid: 12
  spatial_tokens: 144
  token_dim: 2048
  num_views: 3
  view_slots: [head, left_wrist, right_wrist]
  rgb_size: 384
  time_binding: episode_row_ordinal_with_pts_audit
  missing_view_policy: mask_without_duplication
  state_frame_selection: {mode: observed_greedy_minimum_separation, minimum_separation_seconds: 0.1, preserve_observed_timestamps: true, interpolation: forbidden}

cache:
  schema: wm3d_v8_unified_window_index_v3
  task_partition: episode
  feature_workers_per_node: 8
  decode_workers_per_gpu: 4
  writer_threads_per_worker: 2
  task_claim: atomic_no_clobber
  resume: receipt_and_sha
  view_token_codec: int8_per_vector
  depth_codec: fp16
  point_codec: fp16
  camera_pose_codec: fp32
  rgb_codec: jpeg_pack
  action_proprio_storage: same_episode_artifact

sources:
  - {name: droid, adapter: lerobot, raw_root: __MATERIALIZE_REQUIRED__/raw/droid, adapter_config: __MATERIALIZE_REQUIRED__/adapters/droid.yaml, adapter_contract_sha256: __MATERIALIZE_REQUIRED__, manifest: __MATERIALIZE_REQUIRED__/droid.jsonl, manifest_sha256: __MATERIALIZE_REQUIRED__, embodiment: droid_single_arm, weight: 14, nominal_hours: 350.0, license_id: Apache-2.0}

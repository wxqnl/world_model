  - {name: oxe_taco_play, adapter: lerobot, raw_root: __MATERIALIZE_REQUIRED__/raw/oxe/taco_play, adapter_config: ../adapters/oxe_taco_play.yaml, adapter_contract_sha256: __MATERIALIZE_REQUIRED__, manifest: __MATERIALIZE_REQUIRED__/oxe_taco_play.jsonl, manifest_sha256: __MATERIALIZE_REQUIRED__, embodiment: oxe_taco_play_controller, weight: 10, nominal_hours: null, license_id: upstream_dataset_license}
  - {name: oxe_jaco_play, adapter: lerobot, raw_root: __MATERIALIZE_REQUIRED__/raw/oxe/jaco_play, adapter_config: ../adapters/oxe_jaco_play.yaml, adapter_contract_sha256: __MATERIALIZE_REQUIRED__, manifest: __MATERIALIZE_REQUIRED__/oxe_jaco_play.jsonl, manifest_sha256: __MATERIALIZE_REQUIRED__, embodiment: oxe_jaco_play_controller, weight: 10, nominal_hours: null, license_id: upstream_dataset_license}
  - {name: atomic, adapter: lerobot, raw_root: __MATERIALIZE_REQUIRED__/raw/atomic, adapter_config: __MATERIALIZE_REQUIRED__/adapters/robocasa.yaml, adapter_contract_sha256: __MATERIALIZE_REQUIRED__, manifest: __MATERIALIZE_REQUIRED__/atomic.jsonl, manifest_sha256: __MATERIALIZE_REQUIRED__, embodiment: robocasa_mobile_single_arm, weight: 4, nominal_hours: 21.0, license_id: MIT}

schema: wm3d_v8_data_profile_v4
name: public_robot_5649h_legacy_compatible

# 该 profile 保留已经交付的 V7 5B 数据家庭、时长预算和确定性采样权重，
# 但所有 payload 必须重新通过 WM3D adapter/current-state/time ABI 审计。
# T/K/模型规模不进入 episode cache identity；同一 cache 可供 1B/5B 使用。
cache_representation:
  schema: wm3d_v8_episode_representation_v1
  token_grid: 12
  spatial_tokens: 144
  token_dim: 2048
  num_views: 3
  view_slots: [head, left_wrist, right_wrist]
  rgb_size: 384
  time_binding: episode_row_ordinal_with_pts_audit
  missing_view_policy: mask_without_duplication
  state_frame_selection:
    mode: observed_greedy_minimum_separation
    minimum_separation_seconds: 0.1
    preserve_observed_timestamps: true
    interpolation: forbidden

cache:
  schema: wm3d_v8_unified_window_index_v3
  task_partition: episode
  feature_workers_per_node: 8
  decode_workers_per_gpu: 4
  writer_threads_per_worker: 2
  task_claim: atomic_no_clobber
  resume: receipt_and_sha
  view_token_codec: int8_per_vector
  depth_codec: fp16
  point_codec: fp16
  camera_pose_codec: fp32
  rgb_codec: jpeg_pack
  action_proprio_storage: same_episode_artifact

# 顺序和整数权重必须保持为 V7 5650h 合同的 100-sample 周期。
# legacy residual 必须先排除 provenance_dataset=robocasa365_mg；完整 MG 只由
# robocasa_full 提供一次，禁止重复计数或把 expanded 6106.4h 配比混进来。
sources:
  - name: legacy_v7_formal
    adapter: lerobot
    raw_root: __MATERIALIZE_REQUIRED__/legacy_v7_residual
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/legacy_v7_residual.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/legacy_formal.wm3d.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: legacy_v7_single_arm
    weight: 10
    nominal_hours: 397.0
    license_id: operator_verified_v7_sources
  - name: robocasa_full
    adapter: lerobot
    raw_root: __MATERIALIZE_REQUIRED__/raw/mg
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/robocasa.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/robocasa_full.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: robocasa_mobile_single_arm
    weight: 15
    nominal_hours: 1615.0
    license_id: MIT
  - name: agibot_2026_imitation
    adapter: agibot
    raw_root: __MATERIALIZE_REQUIRED__/materialized/agibot2026_imitation
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/agibot_world2026.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/agibot_2026_imitation.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: agibot_bimanual_wholebody
    weight: 10
    nominal_hours: 295.0
    license_id: CC-BY-NC-SA-4.0
  - name: agibot_2026_rich
    adapter: agibot
    raw_root: __MATERIALIZE_REQUIRED__/materialized/agibot2026_rich
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/agibot_world2026.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/agibot_2026_rich.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: agibot_bimanual_wholebody
    weight: 8
    nominal_hours: 155.0
    license_id: CC-BY-NC-SA-4.0
  - name: agibot_2026_reinforcement
    adapter: agibot
    raw_root: __MATERIALIZE_REQUIRED__/materialized/agibot2026_reinforcement
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/agibot_world2026.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/agibot_2026_reinforcement.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: agibot_bimanual_wholebody
    weight: 12
    nominal_hours: 211.0
    license_id: CC-BY-NC-SA-4.0
  - name: agibot_beta
    adapter: agibot
    raw_root: __MATERIALIZE_REQUIRED__/materialized/agibot_beta
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/agibot_beta.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/agibot_beta.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: agibot_bimanual_wholebody
    weight: 45
    nominal_hours: 2976.4
    license_id: operator_verified_upstream_license

embodiments:
  - name: legacy_v7_single_arm
    embodiment_id: 5
    groups:
      - name: arm
        group_id: 30
        action_semantics: [delta_position_m, delta_position_m, delta_position_m, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, absolute_gripper_open01]
        # V7 manifest 没有封存 current-state ABI。正式导入必须由真实 parquet
        # 重新审计并提供下列 10D state；缺失时禁止 zero/fallback。
        state_semantics: [eef_position_m, eef_position_m, eef_position_m, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, gripper_close01]
        action_frame: robot_base
        state_frame: robot_base
        composition_operators: [sum, sum, sum, so3_axis_angle_base_left, so3_axis_angle_base_left, so3_axis_angle_base_left, logical_last]
  - name: robocasa_mobile_single_arm
    embodiment_id: 3
    groups:
      - name: base
        group_id: 10
        action_semantics: [controller_command, controller_command, controller_command, controller_command]
        state_semantics: [base_pose, base_pose, base_pose]
        action_frame: robot_base
        state_frame: world
        composition_operators: [last, last, last, last]
      - name: controller_mode
        group_id: 11
        action_semantics: [controller_mode]
        state_semantics: []
        action_frame: controller_native
        state_frame: controller_native
        composition_operators: [logical_last]
      - name: arm
        group_id: 12
        action_semantics: [delta_position_m, delta_position_m, delta_position_m, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, absolute_gripper_open01]
        state_semantics: [eef_position_m, eef_position_m, eef_position_m, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, eef_rotation_6d, gripper_close01]
        action_frame: robot_base
        state_frame: robot_base
        composition_operators: [sum, sum, sum, so3_axis_angle_base_left, so3_axis_angle_base_left, so3_axis_angle_base_left, logical_last]
  - name: agibot_bimanual_wholebody
    embodiment_id: 4
    groups:
      - name: left_arm
        group_id: 20
        action_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, absolute_gripper_open01]
        state_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, gripper_close01]
        action_frame: left_joint_space
        state_frame: left_joint_space
        composition_operators: [last, last, last, last, last, last, last, logical_last]
      - name: right_arm
        group_id: 21
        action_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, absolute_gripper_open01]
        state_semantics: [joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, joint_position_rad, gripper_close01]
        action_frame: right_joint_space
        state_frame: right_joint_space
        composition_operators: [last, last, last, last, last, last, last, logical_last]
      - name: base
        group_id: 22
        action_semantics: [base_velocity_mps, base_yaw_rate_rps]
        state_semantics: [base_pose, base_pose, base_velocity, base_velocity]
        action_frame: robot_base
        state_frame: world
        composition_operators: [time_weighted_mean, time_weighted_mean]
      - name: waist
        group_id: 23
        action_semantics: [joint_position_rad, joint_position_rad]
        state_semantics: [joint_position_rad, joint_position_rad]
        action_frame: waist_joint_space
        state_frame: waist_joint_space
        composition_operators: [last, last]
      - name: head
        group_id: 24
        action_semantics: [joint_position_rad, joint_position_rad]
        state_semantics: [joint_position_rad, joint_position_rad]
        action_frame: head_joint_space
        state_frame: head_joint_space
        composition_operators: [last, last]

notes:
  nominal_total_hours: 5649.4
  formal_target_unique_hours: 5000-8000
  compatibility_contract: V7 data-family/weight/budget compatible; WM3D action/state/time/cache ABI mandatory
  overlap_policy: legacy_v7_formal 必须排除旧 robocasa365_mg 40k，再由 robocasa_full 提供完整 1615h MG 一次
  cadence_contract: state/action 均保留 source-native 时间戳，不做全局 5Hz/20Hz/30Hz 重采样
  adapter_contract: 模板不可直接训练；所有字段、单位、坐标系、gripper 极性、group 与 current-state 必须由实际 snapshot 的审计 receipt 封存

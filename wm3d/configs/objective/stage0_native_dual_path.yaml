schema: wm3d_v8_objective_profile_v1
name: stage0_native_dual_path
objective:
  # Keep L1 as a reported diagnostic, but avoid counting the same pixel
  # residual twice in the optimized total.
  rgb_l1: 0.0
  # LPIPS restores perceptual supervision; pixel and gradient terms remain
  # explicit anchors instead of being silently replaced.
  rgb_perceptual: 0.1
  token_mse: 1.0
  token_cosine: 0.1
  appearance_mse: 1.0
  appearance_cosine: 0.1
  rgb_charbonnier: 1.5
  rgb_charbonnier_epsilon: 0.001
  rgb_gradient: 0.25
  depth_log: 1.5
  point: 0.5
  camera_pose: 0.1
  action_fine: 2.0
  action_coarse: 1.0
  # Compare the factual world with the same model/dynamics under zero future
  # action values.  The detached zero branch is a real counterfactual; the
  # action-free policy prior is not a valid control for this ranking.
  action_counterfactual_token_advantage: 1.0
  action_counterfactual_token_margin: 0.005
  action_counterfactual_rgb_advantage: 1.0
  action_counterfactual_rgb_margin: 0.002
  # 不同 source-native cadence 及 delta/absolute semantic 没有统一速度正则定义。
  action_velocity: 0.0
  epsilon: 0.000001
  huber_delta: 0.05

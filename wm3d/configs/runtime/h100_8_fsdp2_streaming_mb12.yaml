schema: wm3d_v8_runtime_profile_v1
name: h100_8_fsdp2_streaming_mb12
expected_world_size: 8
distributed:
  strategy: fsdp2
  initialization: meta_sharded
  shard_degree: 8
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: true
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 5
train:
  micro_batch_size: 12
  validation_micro_batch_size: 2
  gradient_accumulation: 1
  global_batch_size: 96
  total_steps: 100000
  seed: 3407
  validation_seed: 7340
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  gradient_clip: 1.0
  log_every: 10
  validate_every: 1000
  validation_steps: 20
  checkpoint_interval: 10000
  checkpoint_steps: [1000, 5000]
optimizer:
  name: adamw
  peak_lr: 0.00012
  min_lr: 0.000012
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
schedule:
  name: warmup_stable_cosine
  warmup_steps: 2000
  stable_fraction: 0.55
checkpoint:
  allow_topology_reshard: false
  async_save: false

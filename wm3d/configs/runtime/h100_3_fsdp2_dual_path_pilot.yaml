schema: wm3d_v8_runtime_profile_v1
name: h100_3_fsdp2_dual_path_pilot
expected_world_size: 3
distributed:
  strategy: fsdp2
  initialization: meta_sharded
  shard_degree: 3
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: true
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 10
train:
  micro_batch_size: 1
  gradient_accumulation: 1
  global_batch_size: 3
  total_steps: 200
  seed: 3407
  validation_seed: 7340
  num_workers: 2
  prefetch_factor: 2
  persistent_workers: true
  gradient_clip: 1.0
  log_every: 5
  validate_every: 50
  validation_steps: 5
  checkpoint_interval: 200
  checkpoint_steps: [20, 100]
  validation_micro_batch_size: 1
  activation_checkpointing: true
  rgb_decode_chunk_size: 2
  appearance_teacher_start_ratio: 1.0
  appearance_teacher_end_ratio: 0.0
  appearance_teacher_decay_steps: 150
optimizer:
  name: adamw
  peak_lr: 0.0001
  min_lr: 0.00001
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
schedule:
  name: warmup_stable_cosine
  warmup_steps: 20
  stable_fraction: 0.5
checkpoint:
  allow_topology_reshard: false
  async_save: false

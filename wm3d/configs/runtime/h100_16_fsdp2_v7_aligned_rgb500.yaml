schema: wm3d_v8_runtime_profile_v1
name: h100_16_fsdp2_v7_aligned_rgb500
expected_world_size: 16
distributed:
  strategy: fsdp2
  initialization: meta_sharded
  shard_degree: 8
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: false
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 30
train:
  micro_batch_size: 8
  validation_micro_batch_size: 1
  gradient_accumulation: 1
  global_batch_size: 128
  total_steps: 500
  seed: 3407
  validation_seed: 7340
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  gradient_clip: 1.0
  log_every: 10
  validate_every: 250
  validation_steps: 5
  checkpoint_interval: 500
  checkpoint_steps: [1, 20, 100, 250, 500]
  activation_checkpointing: true
  rgb_decode_chunk_size: 16
  rgb_perceptual_chunk_size: 8
  appearance_teacher_start_ratio: 1.0
  appearance_teacher_end_ratio: 0.0
  appearance_teacher_decay_steps: 500
  appearance_teacher0_every_steps: 4
  appearance_validation_three_way: true
  # Reuse the learned V7-style dynamics and renderer filters. Only the newly
  # declared alignment modules remain freshly initialized.
  model_warmstart_checkpoint: /data/Minko/wm3d_formal_1b_p256_norml1_causalar_operatoropt_2node16_20260827/training/checkpoints/step_00002000
  model_warmstart_new_parameter_prefixes:
    - rgb_head.image_decoder.motion_token_stem.
    - rgb_head.image_decoder.motion_view_proj.
    - rgb_head.image_decoder.motion_geometry_stem.
    - rgb_head.image_decoder.motion_action_proj.
    - rgb_head.image_decoder.motion_task_proj.
    - rgb_head.image_decoder.motion_to_synthesis.
    - rgb_head.image_decoder.motion_ups.
    - rgb_head.image_decoder.motion_head.
    - rgb_head.image_decoder.flow_head.
    - rgb_head.image_decoder.disocclusion_head.
optimizer:
  name: adamw
  start_lr: 0.00005
  peak_lr: 0.00012
  min_lr: 0.000012
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
schedule:
  name: warmup_stable_cosine
  warmup_steps: 50
  stable_fraction: 0.6
checkpoint:
  allow_topology_reshard: false
  async_save: false

schema: wm3d_v8_runtime_profile_v1
name: h100_16_fsdp2_v8_core_50k
expected_world_size: 16
distributed:
  strategy: fsdp2
  initialization: meta_sharded
  shard_degree: 8
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: false
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 30
train:
  micro_batch_size: 16
  validation_micro_batch_size: 1
  gradient_accumulation: 1
  global_batch_size: 256
  total_steps: 50000
  seed: 3407
  validation_seed: 7340
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  gradient_clip: 1.0
  log_every: 10
  validate_every: 500
  validation_steps: 10
  checkpoint_interval: 5000
  checkpoint_steps: [20, 100, 500, 2500]
  rgb_decode_chunk_size: 32
  rgb_perceptual_chunk_size: 16
  # No future target token enters the state-detail prediction path. Keeping
  # teacher ratios at zero makes train and serving behavior identical.
  appearance_teacher_start_ratio: 0.0
  appearance_teacher_end_ratio: 0.0
  appearance_teacher_decay_steps: 1
  appearance_teacher0_every_steps: 2
  appearance_validation_three_way: false
optimizer:
  name: adamw
  # Start at the stable floor instead of spending the whole 500-step canary
  # near zero while retaining the formal-run warmup to peak.
  start_lr: 0.000012
  peak_lr: 0.00012
  min_lr: 0.000012
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
schedule:
  name: warmup_stable_cosine
  warmup_steps: 1000
  stable_fraction: 0.55
checkpoint:
  allow_topology_reshard: false
  async_save: false

schema: wm3d_v8_runtime_profile_v1
name: h100_8_fsdp2_rgb_ab1k
expected_world_size: 8
distributed:
  strategy: fsdp2
  initialization: meta_sharded
  shard_degree: 8
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: false
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 30
resources:
  gpu_name_substring: H100
  minimum_gpu_memory_mib: 80000
  require_zero_uncorrected_ecc: true
  require_idle_gpu: true
  require_full_local_nvlink_clique: true
  minimum_ib_rate_gbps: 400
  forbid_nccl_ib_disable: true
  minimum_memlock_bytes: 1073741824
  minimum_nofile: 1048576
  minimum_shm_bytes: 34359738368
  minimum_data_free_bytes: 53687091200
  minimum_output_free_bytes: 21474836480
  minimum_allreduce_gbps: 100
  maximum_preflight_age_seconds: 1800
train:
  micro_batch_size: 16
  validation_micro_batch_size: 1
  gradient_accumulation: 1
  global_batch_size: 128
  total_steps: 1000
  seed: 3407
  validation_seed: 7340
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  gradient_clip: 1.0
  log_every: 10
  validate_every: 250
  validation_steps: 5
  checkpoint_interval: 1000
  checkpoint_steps: [250, 500]
  rgb_decode_chunk_size: 16
  appearance_teacher_start_ratio: 1.0
  appearance_teacher_end_ratio: 0.0
  appearance_teacher_decay_steps: 750
optimizer:
  name: adamw
  peak_lr: 0.00012
  min_lr: 0.000012
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
schedule:
  name: warmup_stable_cosine
  warmup_steps: 100
  stable_fraction: 0.55
checkpoint:
  allow_topology_reshard: false
  async_save: false

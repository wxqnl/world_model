schema: wm3d_v8_runtime_profile_v1
name: h200_64_fsdp2_validation100k
expected_world_size: 64
distributed:
  strategy: fsdp2
  initialization: meta_sharded
  shard_degree: 8
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: true
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 45
resources:
  gpu_name_substring: H200
  minimum_gpu_memory_mib: 135000
  require_zero_uncorrected_ecc: true
  require_idle_gpu: true
  require_full_local_nvlink_clique: true
  minimum_ib_rate_gbps: 400.0
  forbid_nccl_ib_disable: true
  minimum_memlock_bytes: 1073741824
  minimum_nofile: 1048576
  minimum_shm_bytes: 64000000000
  minimum_data_free_bytes: 10000000000000
  minimum_output_free_bytes: 10000000000000
  minimum_allreduce_gbps: 4.0
  maximum_preflight_age_seconds: 1800
train:
  micro_batch_size: 4
  validation_micro_batch_size: 1
  gradient_accumulation: 1
  global_batch_size: 256
  total_steps: 100000
  seed: 3407
  validation_seed: 7340
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  gradient_clip: 1.0
  log_every: 10
  validate_every: 1000
  validation_steps: 20
  checkpoint_interval: 1000
  checkpoint_steps: []
  rgb_decode_chunk_size: 2
  rgb_perceptual_chunk_size: 8
  appearance_teacher_start_ratio: 1.0
  appearance_teacher_end_ratio: 0.0
  appearance_teacher_decay_steps: 10000
  appearance_validation_three_way: true
  rgb_tokenizer:
    source_root: /data/models/cosmos-predict2
    checkpoint: /data/models/cosmos_predict2_2b_ac/tokenizer/tokenizer.pth
    encode_chunk: 4
    decode_chunk: 2
    latent_channels: 16
    spatial_compression: 8
  rgb_flow_teacher:
    source_root: /data/models/WorldArena/third_party/RAFT
    checkpoint: /data/models/WorldArena/raft/RAFT/models/raft-things.pth
    input_size: 256
    iterations: 12
    output_grid: 48
    batch_chunk: 8
    flow_max_pixels: 128.0
    consistency_relative: 0.01
    consistency_absolute: 0.5
optimizer:
  name: adamw
  peak_lr: 0.00012
  min_lr: 0.000012
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
schedule:
  name: warmup_stable_cosine
  warmup_steps: 2000
  stable_fraction: 0.55
checkpoint:
  allow_topology_reshard: false
  async_save: false

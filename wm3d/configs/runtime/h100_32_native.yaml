schema: wm3d_v8_runtime_profile_v1
name: h100_32_native_pretraining
expected_world_size: 32
distributed:
  strategy: fsdp2
  initialization: pretrained_root
  shard_degree: 8
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: true
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 60
train:
  train_episode_allowlist: /data/Minko/wm3d_v7_world_1000h_data_20260909/train_episode_allowlist.json
  micro_batch_size: 1
  gradient_accumulation: 1
  global_batch_size: 32
  # Planning profile only. Set final batch/budget after the two-node pilot.
  total_steps: 100000
  seed: 3407
  validation_seed: 7340
  num_workers: 0
  prefetch_factor: 2
  persistent_workers: false
  gradient_clip: 1.0
  log_every: 10
  validate_every: 1000
  validation_steps: 20
  checkpoint_interval: 5000
  checkpoint_steps: [100, 500, 2500]
  activation_checkpointing: true
optimizer:
  name: adamw
  peak_lr: 0.0001
  min_lr: 0.00001
  video_backbone_lr_scale: 0.1
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.01
schedule:
  name: warmup_stable_cosine
  warmup_steps: 5000
  stable_fraction: 0.55
checkpoint:
  allow_topology_reshard: false
  async_save: false

schema: wm3d_v8_runtime_profile_v1
name: h100_8_fsdp2_streaming_formal100k
expected_world_size: 8
distributed:
  strategy: fsdp2
  initialization: meta_sharded
  shard_degree: 8
  param_dtype: bf16
  reduce_dtype: fp32
  output_dtype: bf16
  reshard_after_forward: true
  find_unused_parameters: false
  broadcast_buffers: false
  timeout_minutes: 30
resources:
  gpu_name_substring: H100
  minimum_gpu_memory_mib: 80000
  require_zero_uncorrected_ecc: true
  require_idle_gpu: true
  require_full_local_nvlink_clique: true
  minimum_ib_rate_gbps: 400
  forbid_nccl_ib_disable: true
  minimum_memlock_bytes: 1073741824
  minimum_nofile: 1048576
  minimum_shm_bytes: 68719476736
  minimum_data_free_bytes: 429496729600
  minimum_output_free_bytes: 214748364800
  minimum_allreduce_gbps: 100
  maximum_preflight_age_seconds: 1800
train:
  micro_batch_size: 4
  gradient_accumulation: 2
  global_batch_size: 64
  total_steps: 100000
  seed: 3407
  validation_seed: 7340
  num_workers: 8
  prefetch_factor: 4
  persistent_workers: true
  gradient_clip: 1.0
  log_every: 10
  validate_every: 1000
  validation_steps: 20
  checkpoint_interval: 10000
  checkpoint_steps: [1000, 5000]
optimizer:
  name: adamw
  peak_lr: 0.00012
  min_lr: 0.000012
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1
schedule:
  name: warmup_stable_cosine
  warmup_steps: 2000
  stable_fraction: 0.55
checkpoint:
  allow_topology_reshard: false
  async_save: false

schema: wm3d_v7_dataset_v1
name: wm3d_v7_public6106h_planning
feature_fps: 5.0
action_fps: 30.0
T: 24
P: 144
K: 16
token_dim: 2048
task_dim: 2048
num_views: 3
max_action_groups: 8
max_action_dim: 16
action_substeps: 6
max_group_id: 64
max_embodiments: 256
max_aux_tokens: 8
aux_dim: 256
max_aux_type_id: 64

# 权重定义每 100 个样本的确定性采样周期。DROID/Bridge/Atomic/
# Composite/MG 保持 V7 原五路 35/15/10/20/20 的相对比例，并占总周期 40%。
source_order:
  - droid
  - bridge
  - atomic
  - composite
  - mg
  - agibot_2026_imitation
  - agibot_2026_rich
  - agibot_2026_reinforcement
  - agibot_beta

sources:
  - name: droid
    adapter: lerobot
    raw_root: ${DROID_ROOT}
    license_id: Apache-2.0
    nominal_hours: 350.0
    weight: 14
    embodiment_names: [droid_cartesian_7d]
    split_seed: 701
    train_fraction: 0.98
  - name: bridge
    adapter: lerobot
    raw_root: ${BRIDGE_ROOT}
    license_id: Apache-2.0
    nominal_hours: 100.0
    weight: 6
    embodiment_names: [bridge_widowx_7d]
    split_seed: 702
    train_fraction: 0.98
  - name: atomic
    adapter: lerobot
    raw_root: ${ATOMIC_ROOT}
    license_id: MIT
    nominal_hours: 21.0
    weight: 4
    embodiment_names: [robocasa_panda_omron_12d]
    split_seed: 703
    train_fraction: 0.98
  - name: composite
    adapter: lerobot
    raw_root: ${COMPOSITE_ROOT}
    license_id: MIT
    nominal_hours: 383.0
    weight: 8
    embodiment_names: [robocasa_panda_omron_12d]
    split_seed: 704
    train_fraction: 0.98
  - name: mg
    adapter: lerobot
    raw_root: ${MG_ROOT}
    license_id: MIT
    nominal_hours: 1615.0
    weight: 8
    embodiment_names: [robocasa_panda_omron_12d]
    split_seed: 705
    train_fraction: 0.98
  - name: agibot_2026_imitation
    adapter: lerobot_collection
    raw_root: ${AGIBOT_2026_IMITATION_ROOT}
    license_id: CC-BY-NC-SA-4.0
    nominal_hours: 295.0
    weight: 10
    embodiment_names: [agibot_g2_wholebody_22d]
    split_seed: 706
    train_fraction: 0.98
  - name: agibot_2026_rich
    adapter: lerobot_collection
    raw_root: ${AGIBOT_2026_RICH_ROOT}
    license_id: CC-BY-NC-SA-4.0
    nominal_hours: 155.0
    weight: 8
    embodiment_names: [agibot_g2_wholebody_22d]
    split_seed: 707
    train_fraction: 0.98
  - name: agibot_2026_reinforcement
    adapter: lerobot_collection
    raw_root: ${AGIBOT_2026_REINFORCEMENT_ROOT}
    license_id: CC-BY-NC-SA-4.0
    nominal_hours: 211.0
    weight: 12
    embodiment_names: [agibot_g2_wholebody_22d]
    split_seed: 708
    train_fraction: 0.98
  - name: agibot_beta
    adapter: lerobot_collection
    raw_root: ${AGIBOT_BETA_ROOT}
    license_id: operator_verified_agibot_beta_gated
    nominal_hours: 2976.4
    weight: 30
    embodiment_names: [agibot_g2_wholebody_22d]
    split_seed: 709
    train_fraction: 0.98

embodiments:
  - name: droid_cartesian_7d
    embodiment_id: 0
    views: [head, left_hand, right_hand]
    action_groups:
      - name: arm
        group_id: 0
        dimensions: [x, y, z, roll, pitch, yaw]
        rate_hz: 30.0
        control_mode: cartesian_command
      - name: gripper
        group_id: 1
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
    auxiliary_modalities: []

  - name: bridge_widowx_7d
    embodiment_id: 1
    views: [head, left_hand, right_hand]
    action_groups:
      - name: arm
        group_id: 2
        dimensions: [dx, dy, dz, droll, dpitch, dyaw]
        rate_hz: 30.0
        control_mode: delta_pose
      - name: gripper
        group_id: 3
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
    auxiliary_modalities: []

  # RoboCasa365 action 是 4+1+3+3+1=12 维。
  - name: robocasa_panda_omron_12d
    embodiment_id: 2
    views: [head, left_hand, right_hand]
    action_groups:
      - name: base_motion
        group_id: 10
        dimensions: [base_0, base_1, base_2, base_3]
        rate_hz: 30.0
        control_mode: base_motion
      - name: control_mode
        group_id: 11
        dimensions: [mode]
        rate_hz: 30.0
        control_mode: discrete_mode
      - name: arm_translation
        group_id: 12
        dimensions: [dx, dy, dz]
        rate_hz: 30.0
        control_mode: delta_position
      - name: arm_rotation
        group_id: 13
        dimensions: [dax, day, daz]
        rate_hz: 30.0
        control_mode: delta_axis_angle
      - name: gripper
        group_id: 14
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
    auxiliary_modalities: []

  # AgiBot G2 规划布局：双臂 14 + 双夹爪 2 + 底盘 2 + 腰 2 + 头 2。
  # source schema audit 若发现冻结快照不同，会在生成 episode plan 前终止。
  - name: agibot_g2_wholebody_22d
    embodiment_id: 3
    views: [head, left_hand, right_hand]
    action_groups:
      - name: left_arm
        group_id: 20
        dimensions: [j0, j1, j2, j3, j4, j5, j6]
        rate_hz: 30.0
        control_mode: joint_position
      - name: left_gripper
        group_id: 21
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
      - name: right_arm
        group_id: 22
        dimensions: [j0, j1, j2, j3, j4, j5, j6]
        rate_hz: 30.0
        control_mode: joint_position
      - name: right_gripper
        group_id: 23
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
      - name: base
        group_id: 24
        dimensions: [vx, wz]
        rate_hz: 30.0
        control_mode: base_velocity
      - name: waist
        group_id: 25
        dimensions: [lift, yaw]
        rate_hz: 30.0
        control_mode: joint_position
      - name: head
        group_id: 26
        dimensions: [yaw, pitch]
        rate_hz: 30.0
        control_mode: joint_position
    auxiliary_modalities:
      - name: proprio
        type_id: 0
        dimensions:
          [q0, q1, q2, q3, q4, q5, q6, q7, q8, q9, q10, q11,
           q12, q13, q14, q15, q16, q17, q18, q19, q20, q21]
        rate_hz: 30.0

notes:
  planning_snapshot: "2026-08-04"
  nominal_total_hours: 6106.4
  formal_target_unique_hours: 5000-8000
  overlap_policy: 每个公开仓库只进入一次 source_order；dataset seal 按 episode identity 和内容哈希检查重复
  operator_requirement: source scan 的实测帧数、时长与 schema receipt 是正式统计依据

schema: wm3d_v7_pretrain_config_v1

# This file is deliberately not launchable.  materialize_config.py binds all
# placeholders to one sealed dataset, code receipt, topology and run lineage.
run:
  name: __MATERIALIZE_REQUIRED__
  run_lineage: __MATERIALIZE_REQUIRED__
  output_root: __MATERIALIZE_REQUIRED__
  code_receipt_path: __MATERIALIZE_REQUIRED__
  code_receipt_sha256: __MATERIALIZE_REQUIRED__
  environment_contract_path: __MATERIALIZE_REQUIRED__
  environment_contract_sha256: __MATERIALIZE_REQUIRED__
  environment_receipt_path: __MATERIALIZE_REQUIRED__

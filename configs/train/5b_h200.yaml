  view_hidden: 1024
  view_heads: 8
  view_ff_mult: 2.5
  max_action_groups: 8
  max_action_dim: 16
  action_substeps: 6
  max_group_id: 64
  max_embodiments: 256
  memory_dim: 2048
  memory_every_state_layers: 4
  max_aux_tokens: 8
  aux_dim: 256
  max_aux_type_id: 64
  rgb_hidden: 512
  rgb_size: 384
  rgb_decode_indices: [3, 7, 11, 15]

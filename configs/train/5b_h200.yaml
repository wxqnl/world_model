  token_cosine: 0.1
  rgb_charbonnier: 2.0
  rgb_gradient: 0.5
  rgb_laplacian: 0.2
  depth_log: 1.5
  depth_gradient: 0.25
  point: 0.5
  geometry_confidence: 0.1
  camera_pose: 0.1

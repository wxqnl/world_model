        group_id: 32
        dimensions: [j0, j1, j2, j3, j4, j5]
        rate_hz: 30.0
        control_mode: joint_position
      - name: left_gripper
        group_id: 33
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
      - name: right_arm
        group_id: 34
        dimensions: [j0, j1, j2, j3, j4, j5]
        rate_hz: 30.0
        control_mode: joint_position
      - name: right_gripper
        group_id: 35
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
    auxiliary_modalities: []


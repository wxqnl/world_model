schema: wm3d_v8_data_profile_v4
name: stage1_robocasa_real_4roots

cache_representation:
  schema: wm3d_v8_episode_representation_v1
  token_grid: 8
  spatial_tokens: 64
  token_dim: 2048
  num_views: 3
  view_slots: [agentview_left, agentview_right, eye_in_hand]
  rgb_size: 256
  time_binding: episode_row_ordinal_with_pts_audit
  missing_view_policy: mask_without_duplication
  state_frame_selection:
    mode: observed_greedy_minimum_separation
    minimum_separation_seconds: 0.0
    preserve_observed_timestamps: true
    interpolation: forbidden

cache:
  schema: wm3d_v8_unified_window_index_v3
  task_partition: episode
  feature_workers_per_node: 4
  decode_workers_per_gpu: 2
  writer_threads_per_worker: 2
  task_claim: atomic_no_clobber
  resume: receipt_and_sha
  view_token_codec: int8_per_vector
  depth_codec: fp16
  point_codec: fp16
  camera_pose_codec: fp32
  rgb_codec: jpeg_pack
  action_proprio_storage: same_episode_artifact

sources:
  - name: robocasa_stage1_real_blender
    adapter: lerobot
    raw_root: __MATERIALIZE_REQUIRED__/raw/robocasa_stage1_real
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/robocasa_panda_omron_real_rollout.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/robocasa_stage1_real.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: robocasa_panda_omron
    weight: 100
    nominal_hours: 0.013
    license_id: NVIDIA_OPEN_MODEL_LICENSE
  - name: robocasa_stage1_real_coffee
    adapter: lerobot
    raw_root: __MATERIALIZE_REQUIRED__/raw/robocasa_stage1_real_coffee
    adapter_config: __MATERIALIZE_REQUIRED__/adapters/robocasa_panda_omron_real_rollout.yaml
    adapter_contract_sha256: __MATERIALIZE_REQUIRED__
    manifest: __MATERIALIZE_REQUIRED__/robocasa_stage1_real_coffee.jsonl
    manifest_sha256: __MATERIALIZE_REQUIRED__
    embodiment: robocasa_panda_omron
    weight: 100
    nominal_hours: 0.004
    license_id: NVIDIA_OPEN_MODEL_LICENSE

embodiments:
  - name: robocasa_panda_omron
    embodiment_id: 110
    groups:
      - name: base
        group_id: 110
        action_semantics: [controller_command, controller_command, controller_command, controller_command]
        state_semantics: [base_pose, base_pose, base_pose, base_pose, base_pose, base_pose, base_pose]
        action_frame: omron_controller_native
        state_frame: robot_base_pose_position_quaternion_native
        composition_operators: [last, last, last, last]
      - name: mode
        group_id: 111
        action_semantics: [controller_mode]
        state_semantics: []
        action_frame: arm_base_controller_mode_binary01
        state_frame: not_applicable
        composition_operators: [logical_last]
      - name: arm
        group_id: 112
        action_semantics: [delta_position_m, delta_position_m, delta_position_m, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, delta_rotation_axis_angle_rad, absolute_gripper_open01]
        state_semantics: [eef_position_m, eef_position_m, eef_position_m, controller_state, controller_state, controller_state, controller_state, controller_state, controller_state]
        action_frame: robot_base
        state_frame: robot_base_relative_eef_position_quaternion_and_gripper_qpos
        composition_operators: [sum, sum, sum, so3_axis_angle_base_left, so3_axis_angle_base_left, so3_axis_angle_base_left, logical_last]

notes:
  purpose: 真实 RoboCasa same-root simulator Stage1 四 episode 发布验证；OpenBlenderLid 三条加 CoffeeServeMug 一条，各自 source receipt 封存
  cadence_contract: 保留源数据和 simulator 的实测/封存时钟，不写死全局 world/action 频率
  selection_contract: 只允许显式 episode-index 文件，receipt 绑定 episode 列表与源 payload SHA
  state_contract: relative quaternion 和 gripper qpos 保持 controller_state，不猜测 6D 旋转

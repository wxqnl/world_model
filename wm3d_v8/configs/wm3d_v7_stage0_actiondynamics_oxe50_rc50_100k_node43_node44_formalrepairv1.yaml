train:
  # New S0: no V6 checkpoint, no optimizer inheritance, no implicit resume.
  fresh_initialization_required: true
  fresh_init_required: true
  forbid_warm_start: true
  forbid_cross_run_resume: true
  allow_exact_same_run_resume: true
  forbid_resume: false
  strict_v6_native_warm_start: false
  stage_transition: null
  resume_checkpoint: null
  model_initialization: random_world_weights_with_frozen_pinned_codec
  pretrained_world_checkpoint: null
  run_lineage: wm3d_v7_s0_actiondyn_main_formalrepair_20260717_v1
  resume_contract:
    mode: exact_same_run_only
    require_same_run_lineage: true
    require_resume_compatible_config_digest: true
    require_same_output_root: true
    restore_model: true
    restore_optimizer: true
    restore_scheduler: true
    restore_global_step: true
    restore_sampler_cycle: true
    restore_rng: false
    rng_mode: step_addressed_reconstruction
    verify_rng_contract: true
    require_step_named_checkpoint: true
    reject_latest_pt: true
    min_checkpoint_bytes: 15000000000

  num_nodes: 2
  gpus_per_node: 8
  batch_size_per_gpu: 2
  gradient_accumulation_steps: 2
  effective_global_batch: 64
  precision: bf16
  num_workers: 4
  prefetch_factor: 2
  ddp_broadcast_buffers: false
  grad_clip: 1.0
  # Keep the scheduler horizon immutable at 100k. The launcher pauses at 80k
  # with the non-semantic --stop_after_step flag for manual review, then exact
  # resumes this same run/config to 100k if approved.
  max_steps: 100000
  main_promotion_step: 80000
  planned_review_stop_step: 80000
  extension_cap_steps: 100000
  extension_requires_manual_decision: true
  ckpt_every_steps: 5000
  keep_last_checkpoints: 6
  warmup_steps: 2000
  max_val_batches: 32
  abort_on_nonfinite: true
  enable_pixel_loss: true

  # Every factual source conditions the native dynamics on the real action
  # from optimizer step 0.  OXE must never take the old zero-action/
  # representation-only path.
  oxe_representation_only: false
  factual_action_conditioning:
    enabled: true
    start_step: 0
    detach_action_condition: false
    require_valid_action_contract: true
    require_finite_action: true
    allow_zero_hold_action: true
    required_sources:
      - oxe_droid_action
      - oxe_bridge_action
      - robocasa_atomic
      - robocasa_composite
      - robocasa_mg
  action_aux_sources:
    - oxe_droid_action
    - oxe_bridge_action
    - robocasa_atomic
    - robocasa_composite
    - robocasa_mg
  factual_action_sources:
    - oxe_droid_action
    - oxe_bridge_action
    - robocasa_atomic
    - robocasa_composite
    - robocasa_mg
  audited_action_sources:
    - oxe_droid_action
    - oxe_bridge_action
    - robocasa_atomic
    - robocasa_composite
    - robocasa_mg
  representation_only_sources: []
  # This value is consumed directly by
  # train.normalize_action_grip_contract and therefore must stay on its
  # executable enum.  The canonical caches retain continuous close-positive
  # values in [-1, 1]; BCE-facing targets are mapped exactly by (g + 1) / 2.
  action_grip_contract: signed_close
  action_grip_semantics:
    canonical_input: signed_close_positive_continuous
    close01_supervision: exact_affine_g_plus_1_over_2
  factual_main_action_loss_weight: 0.0

  # Sparse state/task -> action bridge.  Its supervised loss is intentionally
  # outside the factual main loss.action path.
  native_action_no_teacher_weight: 0.05
  native_action_no_teacher_pose_space: normalized
  native_action_no_teacher_grip_positive_weight: 1.0
  native_action_no_teacher_start_step: 5000
  native_action_no_teacher_ramp_steps: 5000
  native_action_no_teacher_every: 4

  # Counterfactual loss must touch the native state/action dynamics, not only
  # the context-pixel renderer.  One shuffled factual action is the negative.
  native_core_action_cf_enabled: true
  native_core_action_cf_rank_weight: 1.0
  native_core_action_cf_separation_weight: 0.25
  native_core_action_cf_start_step: 10000
  native_core_action_cf_ramp_steps: 5000
  native_core_action_cf_every: 8
  native_core_action_cf_batch_size: 1
  native_core_action_cf_variants: [shuffled]
  native_core_action_cf_margin: 0.003
  native_core_action_cf_separation_margin: 0.006
  context_pixel_action_rank_weight: 0.0
  context_pixel_action_separation_weight: 0.0

  # Fail-closed early reviews prevent another day-long invalid run.  CF has
  # zero weight exactly at 10K, so its full-weight review is correctly at 15K.
  checkpoint_milestone_steps: [5000, 10000, 15000]
  milestone_reviews:
    fail_closed: true
    pause_on_missing_or_failed_review: true
    required_review_steps:
      - step: 5000
        gates: [factual_action_all_sources, factual_action_grad_projection, finite_rgb_depth_point]
      - step: 10000
        gates: [native_no_teacher_active_finite, native_no_teacher_grad, native_cf_pre_activation_baseline]
      - step: 15000
        gates: [native_core_cf_full_weight_finite, native_core_cf_acc_gap, native_core_cf_state_action_projection_grad, native_core_cf_native_state_dynamics_grad]

  mixed_batch_sampler:
    enabled: true
    seed: 1707
    expected_oxe_fraction: 0.50
    expected_robocasa_fraction: 0.50
    cycle_optimizer_steps: 100
    shuffle_cycle: true
    synchronized_across_ranks: true
    accumulation_group_same_source: true
    num_batches_per_epoch: 50000
    val_num_batches_per_epoch: 100
    source_cycle_counts_exact:
      oxe_droid_action: 35
      oxe_bridge_action: 15
      robocasa_atomic: 10
      robocasa_composite: 20
      robocasa_mg: 20
    forbidden_sources:
      - fractal20220817_data
      - taco_play
      - jaco_play
      - kuka

loss:
  # No direct teacher-forced action head in the factual main objective.  Action
  # relevance is learned through factual dynamics plus the two sparse bridges.
  action: 0.0
  rgb_l1: 1.2
  rgb_lpips: 0.55
  rgb_motion_l1: 1.0
  rgb_edge: 0.08
  rgb_motion_bce: 0.03
  rgb_motion_dice: 0.03
  rgb_motion_pos_weight: 2.0
  rgb_motion_threshold: 0.03
  rgb_motion_gain: 3.0

optimizer:
  peak_lr: 1.0e-5
  min_lr: 1.0e-6
  grad_clip: 1.0

lr_schedule:
  peak_lr: 1.0e-5
  min_lr: 1.0e-6
  warmup_steps: 2000

out:
  root: /data/Minko/world_model/wm3d_v7/results/wm3d_v7_stage0_actiondynamics_oxe50_rc50_100k_node43_node44_formalrepairv1
  require_empty_checkpoint_dir: true

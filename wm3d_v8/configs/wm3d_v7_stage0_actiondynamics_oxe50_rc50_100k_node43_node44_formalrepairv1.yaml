    version: wm3d_v7_base_delta_axisangle_gripclose_v1
    layout: [dx_m, dy_m, dz_m, drot_x_rad, drot_y_rad, drot_z_rad, gripper_close_signed]
    source_frame: base
    translation_unit: meter
    rotation_representation: axis_angle
    gripper_semantics: signed_close_positive_continuous


  profile: main
  preflight_required: true
  preflight_script: scripts/preflight_wm3d_v7_stage0_actiondynamics.py
  canary_required: true
  canary_config: configs/wm3d_v7_stage0_actiondynamics_oxe50_rc50_canary200_node43_node44.yaml
  canary_gate_script: scripts/gate_wm3d_v7_stage0_actiondynamics_canary.py
  auto_promote: false

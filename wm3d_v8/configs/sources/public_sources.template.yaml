schema: wm3d_v8_raw_source_lock_v1

# `revision` 必须物化为远端仓库的 40 位 commit SHA；禁止 main/latest。
# AgiBot 许可需要用户先在 Hugging Face 页面接受，再由 token 文件读取。
sources:
  - name: droid
    transport: huggingface_dataset
    repo_id: lerobot/droid_1.0.1
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    include: ["**"]
    destination: droid
    gated: false
  - name: bridge
    transport: huggingface_dataset
    repo_id: ember-lab-berkeley/bridge_v2
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    include: ["**"]
    destination: bridge
    gated: false
  - name: atomic
    transport: huggingface_dataset
    repo_id: ember-lab-berkeley/robocasa365-pretrain-atomic
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    include: ["**"]
    destination: atomic
    gated: false
  - name: composite
    transport: huggingface_dataset
    repo_id: ember-lab-berkeley/robocasa365-pretrain-composite
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    include: ["**"]
    destination: composite
    gated: false
  - name: mg
    transport: huggingface_dataset
    repo_id: ember-lab-berkeley/robocasa365-pretrain-mg
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    include: ["**"]
    destination: mg
    gated: false
  - name: agibot_world_2026
    transport: huggingface_dataset
    repo_id: agibot-world/AgiBotWorld2026
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    # 目录名来自上游仓库文件树；revision 冻结后仍必须保存一次 file-list 审计。
    include: ["ImitationLearning/**", "RichInteraction/**", "ReinforcementLearning/**", "README.md", "split_episodes_tool.zip"]
    destination: agibot_world_2026
    gated: false
  - name: agibot_beta
    transport: huggingface_dataset
    repo_id: agibot-world/AgiBotWorld-Beta
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    include: ["**"]
    destination: agibot_beta
    gated: true
  - name: agibot_alpha_converter
    # Beta 上游说明要求使用 Alpha 仓库中的官方转换器；转换器本身也必须锁版本。
    transport: huggingface_dataset
    repo_id: agibot-world/AgiBotWorld-Alpha
    revision: __MATERIALIZE_REQUIRED_40_HEX_COMMIT__
    include: ["README.md", "scripts/convert_to_lerobot.py"]
    destination: agibot_alpha_converter
    gated: true

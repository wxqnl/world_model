    P: 64
    D: 2048
    hidden: 1600
    n_layers: 18
    n_heads: 16
    k: 8
    action_cond_dim: 7
  action:
    T: 16
    P: 64
    D: 2048
    hidden: 1024
    n_layers: 10
    n_heads: 16
    k: 8
    z_dim: 224
    action_cond_dim: 7
  xattn_layers_state:

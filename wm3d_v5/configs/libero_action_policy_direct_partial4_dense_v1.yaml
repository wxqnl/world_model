base_cfg: configs/v3_p64_140m_actioncond_context_motion_p0_heads_direct_policy.yaml
data:
  manifest:
    - results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/system_eval_best/libero_expert_cache_partial4_2048/manifest.jsonl
  action_stats: results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/system_eval_best/libero_expert_cache_partial4_2048/action_stats.npz
  preload: true
  val_frac: 0.08
  seed: 37
train:
  init_ckpt: results/wm3d_libero_action_bc_anchor_partial4_v1/ckpt/best.pt
  device: cuda:0
  batch_size: 256
  num_workers: 0
  max_steps: 1000
  eval_every: 100
  lr: 2.0e-4
  weight_decay: 0.02
  warmup_steps: 100
  grad_clip: 1.0
  trainable_prefixes:
    - action_policy.
loss:
  pose_weight: 1.0
  first_pose_weight: 3.0
  delta_weight: 0.3
  grip_weight: 0.4
  first_grip_weight: 1.0
  huber_delta: 1.0
out:
  root: results/wm3d_libero_action_policy_direct_partial4_dense_v1
  ckpt_dir: ckpt

base_cfg: configs/v5_p64_1b_libero_action_policy_base_a2_v1.yaml
data:
  manifest:
  - /data/Minko/world_model/wm3d_v5/manifests/libero_action_policy_full_T16_k8_s4_v1_local.jsonl
  - /data/Minko/world_model/wm3d_v5/results/wm3d_v5_p64_1b_libero_action_policy_a2_nohistft_p3_recovery_v1/recovery_manifest_repeated.jsonl
  action_stats: /data/Minko/wm3d_v5_cache_local/libero_action_policy_full_T16_k8_s4_v1/action_stats.npz
  preload: false
  val_frac: 0.1
  seed: 260612
  plan_state_dim: 17
train:
  init_ckpt: results/wm3d_v5_p64_1b_libero_action_policy_a2_nohistft_p2_noprog_v1/ckpt/best_node42_eval_final.pt
  device: cuda:0
  batch_size: 8
  num_workers: 8
  max_steps: 1500
  eval_every: 300
  lr: 5.0e-5
  lr_multipliers:
    action_policy: 1.0
  weight_decay: 0.02
  warmup_steps: 100
  grad_clip: 1.0
  find_unused_parameters: true
  keep_eval_ckpts: false
  action_history_dropout: 1.0
  progress_dropout: 1.0
  val_select_metric: L_serve_exact
  eval_max_batches: 128
  trainable_prefixes:
  - action_policy.
loss:
  pose_weight: 1.5
  first_pose_weight: 10.0
  delta_weight: 0.2
  grip_weight: 2.5
  grip_transition_weight: 18.0
  first_grip_weight: 4.0
  huber_delta: 0.5
out:
  root: /data/Minko/world_model/wm3d_v5/results/wm3d_v5_p64_1b_libero_action_policy_a2_nohistft_p3_recovery_v1/train
  ckpt_dir: ckpt

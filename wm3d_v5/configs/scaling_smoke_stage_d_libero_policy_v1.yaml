base_cfg: configs/scaling_smoke_stage_c_oxe_policy_v1.yaml
data:
  manifest:
    - results/scaling_smoke_libero_policy_cache_v1/manifest_32.jsonl
  action_stats: results/wm3d_libero_action_policy_lowdimhist_partial4_start_stride4_v1_cache/action_stats.npz
  preload: false
  val_frac: 0.10
  seed: 17
  plan_state_dim: 17
train:
  init_ckpt: results/scaling_smoke_stage_c_oxe_policy_v1/ckpt/best.pt
  device: cuda:0
  batch_size: 4
  num_workers: 0
  max_steps: 5
  eval_every: 5
  lr: 3.0e-5
  weight_decay: 0.02
  warmup_steps: 2
  grad_clip: 1.0
  trainable_prefixes:
    - action_policy.pose_norm_head
    - action_policy.gripper_head
    - action_policy.local_residual_head
    - action_policy.waypoint_head
loss:
  pose_weight: 1.2
  first_pose_weight: 8.0
  delta_weight: 0.2
  grip_weight: 2.5
  grip_transition_weight: 18.0
  first_grip_weight: 4.0
  huber_delta: 0.5
out:
  root: results/scaling_smoke_stage_d_libero_policy_v1
  ckpt_dir: ckpt

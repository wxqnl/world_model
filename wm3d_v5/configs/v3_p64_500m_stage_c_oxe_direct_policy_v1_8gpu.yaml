data:
  manifest: /data/Minko/world_model/wm3d_v3/manifests/oxe_all_trainable_no_video_v1.jsonl
  cache_root: /data/Minko/datasets/cache/wm3d_v3
  tokens_subdir: vggt_pooled
  action_stats: /data/Minko/datasets/cache/wm3d_v3/action_stats.npz
  require_task_emb: true
  load_rgb: false
  load_geom: false
  load_state_tgt: false
  T: 16
  k: 8
  stride: 4
  val_frac: 0.03
  seed: 43
  split:
    mode: episode
    val_frac: 0.03
    seed: 43
model:
  state: { T: 16, P: 64, D: 2048, hidden: 768, n_layers: 10, n_heads: 12, k: 8, action_cond_dim: 7 }
  action: { T: 16, P: 64, D: 2048, hidden: 512, n_layers: 6, n_heads: 8, k: 8, z_dim: 128, action_cond_dim: 7 }
  xattn_layers_state: [2, 5, 8]
  xattn_n_heads: 12
  action_proj_hidden: 512
  action_proj_layers: 4
  geom_hidden: 384
  enable_geom_extra: false
  pixel_hidden: 1024
  pixel_n_res: 2
  enable_pixel: true
  enable_context_pixel: true
  context_pixel_hidden: 896
  context_pixel_action_dim: 7
  context_pixel_task_dim: 2048
  context_pixel_residual_scale: 0.75
  context_pixel_use_action: true
  context_pixel_use_task: true
  context_pixel_predict_motion: true
  context_pixel_motion_blend_gain: 0.5
  enable_progress_head: true
  progress_hidden: 384
  progress_layers: 3
  progress_heads: 6
  progress_action_dim: 7
  progress_task_dim: 2048
  progress_max_horizon: 16
  progress_use_action: true
  progress_use_task: true
  enable_action_proposer: true
  proposer_hidden: 768
  proposer_layers: 4
  proposer_candidates: 4
  proposer_horizon: 8
  proposer_task_dim: 2048
  proposer_dropout: 0.05
  proposer_use_task: true
  enable_action_policy: true
  policy_hidden: 1088
  policy_layers: 10
  policy_heads: 8
  policy_chunk_layers: 4
  policy_horizon: 8
  policy_task_dim: 2048
  policy_max_context: 16
  policy_dropout: 0.1
  policy_use_task: true
  policy_lowdim_dim: 12
  policy_object_state_dim: 112
  policy_plan_state_dim: 17
  policy_action_history_len: 16
  policy_action_history_dim: 7
  policy_use_progress: true
  policy_progress_dim: 1
  policy_progress_mode: summary
  policy_enable_local_residual: true
  policy_local_hidden: 512
  policy_local_layers: 3
  policy_local_residual_scale: 1.0
  policy_local_use_lowdim: true
  policy_local_use_plan_state: true
  policy_local_use_progress: true
  policy_local_use_action_history: true
  policy_enable_waypoint_head: true
  policy_waypoint_hidden: 512
  policy_waypoint_layers: 3
  policy_waypoint_num_stages: 4
  policy_waypoint_stage_dim: 4
  policy_waypoint_active_stages: [3]
  policy_waypoint_residual_scale: 1.0
  policy_waypoint_mode: residual
  policy_waypoint_use_summary: true
  policy_waypoint_use_lowdim: true
  policy_waypoint_use_plan_state: true
  policy_waypoint_use_progress: true
  policy_waypoint_use_action_history: true
  policy_enable_prior: true
  policy_prior_chunk_layers: 2
  enable_bridging: false
train:
  epochs: 2
  batch_size_per_gpu: 12
  num_workers: 6
  lr: 1.5e-5
  weight_decay: 0.02
  warmup_steps: 800
  grad_clip: 1.0
  precision: bf16
  log_every: 25
  ckpt_every_epochs: 1
  ckpt_every_steps: 2000
  max_val_batches: 80
  find_unused_parameters: false
  manual_grad_sync: true
  direct_policy_only: true
  enable_pixel_loss: false
  enable_hunyuan_latent_loss: false
  trainable_prefixes:
    - action_policy.
  direct_policy_head: policy
  direct_policy_weight: 1.0
  direct_policy_pose_weight: 1.2
  direct_policy_first_pose_weight: 8.0
  direct_policy_delta_weight: 0.2
  direct_policy_grip_weight: 2.5
  direct_policy_grip_transition_weight: 18.0
  direct_policy_first_grip_weight: 4.0
  direct_policy_huber_delta: 0.5
loss:
  cos: 0.0
  grip: 0.0
  geom_depth: 0.0
  geom_point: 0.0
  geom_pose: 0.0
  action: 0.0
  idm_reg: 0.0
  rgb_l1: 0.0
  rgb_lpips: 0.0
out:
  root: /data/Minko/world_model/wm3d_v3/results/wm3d_v3_p64_500m_stage_c_oxe_direct_policy_v1_8gpu
  tb_dir: tb
  ckpt_dir: ckpt
overfit_clip_ids: []

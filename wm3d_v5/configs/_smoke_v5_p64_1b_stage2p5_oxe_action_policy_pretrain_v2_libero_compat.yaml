  require_task_emb: true
  load_rgb: false
  load_geom: false
  load_state_tgt: false
  load_geom_extra: false
  require_geom_extra: false
  window_geom_subdir: vggt_window_geom_p64_T16_k8_s4_hw64_full_v1
  use_window_tokens: true
  allow_pseudo_progress_targets: false
  T: 16
  k: 8
  stride: 4
  val_frac: 0.03
  seed: 260625
  split:
    mode: episode
    val_frac: 0.03
    seed: 260625
  window_geom_shard_index: /data/Minko/datasets/cache/wm3d_v5_stage0_sharded/vggt_window_geom_p64_T16_k8_s4_hw64_full_v1_shards/index.tsv
  window_geom_shard_root: /data/Minko/datasets/cache/wm3d_v5_stage0_sharded/vggt_window_geom_p64_T16_k8_s4_hw64_full_v1_shards
  node_sharded_window_cache: true
  trust_window_geom_cache: true
  max_windows_per_episode: 0
  require_progress: false
  load_policy_state: false
  require_policy_state: false
  policy_lowdim_dim: 0
  policy_object_state_dim: 0
  policy_plan_state_dim: 0
  policy_action_history_len: 0
  policy_action_history_dim: 7
model:
  state:
    T: 16
    P: 64
    D: 2048
    hidden: 1600
    n_layers: 18
    n_heads: 16
    k: 8
    action_cond_dim: 7
  action:
    T: 16
    P: 64
    D: 2048
    hidden: 1024
    n_layers: 10
    n_heads: 16
    k: 8
    z_dim: 224
    action_cond_dim: 7
  xattn_layers_state:
  - 3
  - 6
  - 9
  - 12
  - 15
  - 17
  xattn_n_heads: 16
  action_proj_hidden: 1024
  action_proj_layers: 5
  geom_hidden: 1792
  geom_upsample_mode: resize_conv
  enable_geom_extra: true
  pixel_hidden: 1152
  pixel_n_res: 2
  enable_pixel: true
  enable_context_pixel: false
  context_pixel_hidden: 1536
  context_pixel_action_dim: 7
  context_pixel_task_dim: 2048
  context_pixel_residual_scale: 0.65
  context_pixel_use_action: true
  context_pixel_use_task: true
  context_pixel_predict_motion: true
  context_pixel_motion_blend_gain: 0.35
  enable_progress_head: true
  progress_hidden: 768
  progress_layers: 4
  progress_heads: 12
  progress_action_dim: 7
  progress_task_dim: 2048
  progress_max_horizon: 16
  progress_use_action: true
  progress_use_task: true
  enable_action_proposer: true
  proposer_hidden: 1024
  proposer_layers: 4
  proposer_candidates: 4
  proposer_horizon: 8
  proposer_task_dim: 2048
  proposer_dropout: 0.05
  proposer_use_task: true
  enable_action_policy: true
  enable_world_prior: false
  world_prior_hidden: 1024
  world_prior_layers: 4
  world_prior_heads: 16
  world_prior_mlp_mult: 4
  world_prior_dropout: 0.0
  world_prior_task_dim: 2048
  world_prior_action_dim: 7
  world_prior_use_context: true
  world_prior_use_action: true
  world_prior_predict_initial: true
  enable_bridging: false
  policy_hidden: 768
  policy_layers: 6
  policy_heads: 8
  policy_chunk_layers: 2
  policy_horizon: 8
  policy_task_dim: 2048
  policy_max_context: 16
  policy_dropout: 0.1
  policy_use_task: true
  policy_lowdim_dim: 12
  policy_object_state_dim: 0
  policy_plan_state_dim: 0
  policy_action_history_len: 0
  policy_action_history_dim: 7
  policy_use_progress: false
  policy_progress_dim: 1
  policy_progress_mode: summary
  policy_enable_local_residual: true
  policy_local_hidden: 256
  policy_local_layers: 2
  policy_local_residual_scale: 1.0
  policy_local_use_lowdim: true
  policy_local_use_plan_state: false
  policy_local_use_progress: false
  policy_local_use_action_history: false
  policy_enable_waypoint_head: false
  policy_waypoint_hidden: 256
  policy_waypoint_layers: 2
  policy_waypoint_num_stages: 4
  policy_waypoint_stage_dim: 4
  policy_waypoint_active_stages:
  - 3
  policy_waypoint_residual_scale: 1.0
  policy_waypoint_mode: residual
  policy_waypoint_use_summary: true
  policy_waypoint_use_lowdim: false
  policy_waypoint_use_plan_state: false
  policy_waypoint_use_progress: false
  policy_waypoint_use_action_history: false
  policy_enable_prior: true
  policy_prior_chunk_layers: 1
  policy_zero_init_output: true
train:
  epochs: 3
  batch_size_per_gpu: 8
  num_workers: 4
  lr: 8.0e-05
  weight_decay: 0.02
  warmup_steps: 1000
  grad_clip: 1.0
  precision: bf16
  log_every: 1
  ckpt_every_epochs: 1
  ckpt_every_steps: 999999
  max_steps: 2
  max_val_batches: 1
  find_unused_parameters: false
  manual_grad_sync: true
  direct_policy_only: true
  enable_pixel_loss: false
  enable_hunyuan_latent_loss: false
  enable_prior_hunyuan_latent_loss: false
  trainable_prefixes:
  - action_policy.
  weighted_sampler:
    enabled: true
    balance_by_dataset: true
    replacement: true
    seed: 260625
  direct_policy_head: policy
  direct_policy_weight: 1.0
  direct_policy_pose_weight: 1.3
  direct_policy_first_pose_weight: 8.0
  direct_policy_delta_weight: 0.2
  direct_policy_grip_weight: 2.5
  direct_policy_grip_transition_weight: 18.0
  direct_policy_first_grip_weight: 4.0
  direct_policy_huber_delta: 0.5
loss:
  cos: 0.0
  grip: 0.0
  geom_depth: 0.0
  depth_change: 0.0
  depth_motion_l1: 0.0
  depth_motion_gain: 3.0
  depth_temporal: 0.0
  depth_tv: 0.0
  geom_point: 0.0
  point_temporal: 0.0
  geom_pose: 0.0
  action: 0.0
  idm_reg: 0.0
  rgb_l1: 0.0
  rgb_lpips: 0.0
  rgb_motion_l1: 0.0
  rgb_edge: 0.0
  rgb_motion_bce: 0.0
  rgb_motion_dice: 0.0
  rgb_motion_pos_weight: 2.0
  rgb_motion_threshold: 0.03
  rgb_motion_gain: 3.0
  progress: 0.0
  terminal_progress: 0.0
  plausibility: 0.0
  proposer_pose: 0.0
  proposer_grip: 0.0
  proposer_anchor: 0.0
  proposer_diversity: 0.0
  proposer_diversity_margin: 0.5
  world_prior: 0.0
  world_prior_init: 0.0
  world_prior_future: 0.0
  world_prior_flow: 0.0
  world_prior_depth: 0.0
  world_prior_rgb_l1: 0.0
  huber_delta: 1.0
out:
  root: /data/Minko/world_model/wm3d_v5/results/_smoke_wm3d_v5_p64_1b_stage2p5_oxe_action_policy_pretrain_v2_libero_compat
  tb_dir: tb
  ckpt_dir: ckpt
overfit_clip_ids: []
optimizer:
  type: adamw
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.02
  grad_clip: 1.0
lr_schedule:
  type: wsd
  peak_lr: 8.0e-05
  min_lr: 8.0e-06
  warmup_steps: 1000
  stable_frac: 0.85
  decay_frac: 0.15
stage2p5_notes:
  purpose: pretrain a reusable deployable action_policy head on original OXE/DROID
    action-labeled pretraining data before downstream VLA benchmark finetuning
  resume: /0604-10T-test/wm3d_v5/checkpoints/wm3d_v5_p64_1b_stage2_action_scaffold_native3d_wsd_4node_v1_best.pt
  libero_data_used: false
  robotwin_data_used: false
  reusable_head_contract: wm_tokens + task_emb + optional lowdim/proprio -> 7D action
    chunk
  libero_compatible_lowdim_slot: true
  policy_lowdim_dim: 12
  lowdim_during_pretrain: not loaded from original data; model fills missing lowdim_state
    with zeros
  downstream_usage: load action_policy weights for LIBERO/RoboTwin finetuning; keep
    common policy decoder, adapt normalization/proprio/action convention as needed
  policy_inputs:
  - wm_tokens
  - task_emb
  - zero_lowdim_slot
  excluded_inputs:
  - action_history
  - progress
  - object_state
  - plan_state

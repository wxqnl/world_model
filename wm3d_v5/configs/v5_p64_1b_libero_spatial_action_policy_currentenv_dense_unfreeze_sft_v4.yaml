base_cfg: configs/v5_p64_1b_libero_action_policy_base_stage2p5_noprog_nohist_v1.yaml
data:
  manifest:
  - /data/Minko/world_model/wm3d_v5/results/libero_spatial_teacher_current_env_cache_v1/manifest.jsonl
  - /data/Minko/world_model/wm3d_v5/results/libero_spatial_teacher_current_env_cache_v2/task0/manifest.jsonl
  - /data/Minko/world_model/wm3d_v5/results/libero_spatial_teacher_current_env_cache_dense64_task1_v1/manifest.jsonl
  - /data/Minko/world_model/wm3d_v5/results/libero_spatial_teacher_current_env_cache_dense64_task1_v1/manifest.jsonl
  - /data/Minko/world_model/wm3d_v5/results/libero_spatial_teacher_current_env_cache_dense64_task1_v1/manifest.jsonl
  action_stats: /data/Minko/wm3d_v5_cache_local/libero_action_policy_deployalign_full_T16_k8_s4_v1/action_stats.npz
  preload: false
  val_frac: 0.06
  seed: 260617
  plan_state_dim: 17
train:
  init_ckpt: /data/Minko/world_model/wm3d_v5/results/wm3d_v5_p64_1b_libero_spatial_action_policy_teacher_currentenv_sft_v2/ckpt/best.pt
  device: cuda:0
  batch_size: 2
  num_workers: 4
  max_steps: 9000
  eval_every: 300
  lr: 3.0e-05
  lr_multipliers:
    dual: 0.04
    action_proj: 0.25
    action_policy: 1.0
  weight_decay: 0.02
  warmup_steps: 500
  grad_clip: 1.0
  find_unused_parameters: true
  keep_eval_ckpts: false
  action_history_dropout: 1.0
  progress_dropout: 1.0
  trainable_prefixes:
  - dual.
  - action_proj.
  - action_policy.
  eval_max_batches: 256
  policy_forward_mode: act_policy
loss:
  pose_weight: 4.0
  first_pose_weight: 32.0
  delta_weight: 0.75
  grip_weight: 3.0
  grip_transition_weight: 12.0
  first_grip_weight: 4.0
  huber_delta: 0.5
out:
  root: /data/Minko/world_model/wm3d_v5/results/wm3d_v5_p64_1b_libero_spatial_action_policy_currentenv_dense_unfreeze_sft_v4
  ckpt_dir: ckpt
notes:
  scope: LIBERO spatial current-environment distillation with dense task1 cache
  init: v2 mixed-data checkpoint, not v3 latest, to avoid v3's early-close drift
  reason: v3 proved gripper can close but pose trajectory remains off; unfreeze deployment path and add dense current-env windows
  trainable: dual/action_proj/action_policy
  task5_data: excluded until current-BDDL demonstrations are generated

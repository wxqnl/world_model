data:
  manifest: /data/Minko/world_model/wm3d_v3/manifests/oxe_droid20k_depthplus_world_v1.jsonl
  cache_root: /data/Minko/datasets/cache/wm3d_v3
  tokens_subdir: vggt_pooled
  action_stats: /data/Minko/datasets/cache/wm3d_v3/action_stats_oxe_droid20k_stage1_world_v1.npz
  require_task_emb: true
  load_rgb: true
  load_geom: true
  load_state_tgt: true
  T: 16
  k: 8
  stride: 4
  val_frac: 0.03
  seed: 909
  split:
    mode: episode
    val_frac: 0.03
    seed: 909
model:
  state:
    T: 16
    P: 64
    D: 2048
    hidden: 1408
    n_layers: 16
    n_heads: 16
    k: 8
    action_cond_dim: 7
  action:
    T: 16
    P: 64
    D: 2048
    hidden: 1024
    n_layers: 12
    n_heads: 16
    k: 8
    z_dim: 224
    action_cond_dim: 7
  xattn_layers_state:
  - 3
  - 6
  - 9
  - 12
  - 15
  xattn_n_heads: 16
  action_proj_hidden: 896
  action_proj_layers: 5
  geom_hidden: 512
  geom_upsample_mode: resize_conv
  enable_geom_extra: false
  pixel_hidden: 1024
  pixel_n_res: 2
  enable_pixel: true
  enable_context_pixel: true
  context_pixel_hidden: 1536
  context_pixel_action_dim: 7
  context_pixel_task_dim: 2048
  context_pixel_residual_scale: 0.65
  context_pixel_use_action: true
  context_pixel_use_task: true
  context_pixel_predict_motion: true
  context_pixel_motion_blend_gain: 0.35
  enable_progress_head: false
  enable_action_proposer: false
  enable_action_policy: false
  enable_world_prior: false
  world_prior_hidden: 1024
  world_prior_layers: 4
  world_prior_heads: 16
  world_prior_mlp_mult: 4
  world_prior_dropout: 0.0
  world_prior_task_dim: 2048
  world_prior_action_dim: 7
  world_prior_use_context: true
  world_prior_use_action: true
  world_prior_predict_initial: true
  enable_bridging: false
train:
  epochs: 8
  batch_size_per_gpu: 3
  num_workers: 4
  lr: 1.2e-05
  weight_decay: 0.02
  warmup_steps: 4000
  grad_clip: 1.0
  precision: bf16
  log_every: 50
  ckpt_every_epochs: 1
  ckpt_every_steps: 2500
  max_val_batches: 96
  find_unused_parameters: false
  manual_grad_sync: false
  direct_policy_only: false
  condition_dropout:
    enabled: false
    text_only_p: 0.0
    text_context_p: 0.0
    text_action_p: 0.0
    action_p: 0.0
    context_p: 0.0
  enable_pixel_loss: true
  enable_hunyuan_latent_loss: false
  enable_prior_hunyuan_latent_loss: false
  prior_hunyuan_latent_weight: 0.0
  prior_hunyuan_use_rough_rgb: true
  hunyuan_latent_weight: 0.0
  hunyuan_latent_mse_weight: 1.0
  hunyuan_latent_l1_weight: 0.1
  hunyuan_latent_temporal_weight: 0.2
  hunyuan_latent_motion_weight: 0.1
  hunyuan_adapter_hidden: 256
  hunyuan_adapter_blocks: 4
  hunyuan_latent_channels: 16
  hunyuan_latent_time: 3
  hunyuan_latent_hw: 32
  hunyuan_use_motion: true
  hunyuan_use_rough_rgb: true
  hunyuan_use_context: true
  hunyuan_use_action: true
  hunyuan_use_task: true
  hunyuan_detach_world: true
  hunyuan_residual_from_rough: true
  hunyuan_residual_scale: 0.5
  hunyuan_zero_init_output: false
  hunyuan_repo: /data/Minko/external/HunyuanVideo
  hunyuan_model_base: /data/Minko/models/hunyuan_video
  hunyuan_vae_precision: fp16
loss:
  cos: 0.1
  grip: 0.5
  geom_depth: 1.6
  depth_change: 0.05
  depth_motion_l1: 0.04
  depth_motion_gain: 3.0
  depth_tv: 0.02
  geom_point: 0.0
  geom_pose: 0.0
  action: 0.05
  idm_reg: 0.0
  world_prior: 0.0
  world_prior_init: 0.5
  world_prior_future: 1.0
  world_prior_depth: 0.0
  world_prior_rgb_l1: 0.0
  world_prior_flow: 0.0
  rgb_l1: 1.2
  rgb_lpips: 0.55
  rgb_motion_l1: 1.0
  rgb_edge: 0.08
  rgb_motion_bce: 0.03
  rgb_motion_dice: 0.03
  rgb_motion_pos_weight: 2.0
  rgb_motion_threshold: 0.03
  rgb_motion_gain: 3.0
out:
  root: /data/Minko/world_model/wm3d_v3/results/v3_p64_1b_stage0_visual_depth_wsd_bs3_4node_v1
  tb_dir: tb
  ckpt_dir: ckpt
overfit_clip_ids: []
optimizer:
  type: adamw
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.02
  grad_clip: 1.0
lr_schedule:
  type: wsd
  peak_lr: 1.2e-05
  min_lr: 1.2000000000000002e-06
  warmup_steps: 4000
  stable_frac: 0.85
  decay_frac: 0.15

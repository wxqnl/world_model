data:
  manifest: /data/Minko/world_model/wm3d_v5/manifests/v5_140m_stage0_native3d_exp8192_v1.jsonl
  cache_root: /0604-10T-test/wm3d_v5/cache
  tokens_subdir: vggt_pooled
  action_stats: /0604-10T-test/wm3d_v5/cache/action_stats_oxe_droid20k_stage1_world_v1.npz
  require_task_emb: true
  load_rgb: true
  load_geom: false
  load_state_tgt: true
  load_geom_extra: true
  require_geom_extra: true
  window_geom_subdir: vggt_window_geom_p64_native3d_v5_140m_stage0_exp8192_w2_v1
  use_window_tokens: true
  allow_pseudo_progress_targets: false
  T: 16
  k: 8
  stride: 4
  max_windows_per_episode: 2
  trust_window_geom_cache: true
  val_frac: 0.03
  seed: 1405
  split:
    mode: episode
    val_frac: 0.03
    seed: 1405
model:
  state:
    T: 16
    P: 64
    D: 2048
    hidden: 768
    n_layers: 8
    n_heads: 12
    k: 8
    action_cond_dim: 7
  action:
    T: 16
    P: 64
    D: 2048
    hidden: 512
    n_layers: 6
    n_heads: 8
    k: 8
    z_dim: 128
    action_cond_dim: 7
  xattn_layers_state:
  - 1
  - 3
  - 5
  - 7
  xattn_n_heads: 12
  action_proj_hidden: 512
  action_proj_layers: 3
  geom_hidden: 256
  geom_upsample_mode: resize_conv
  enable_geom_extra: true
  pixel_hidden: 256
  pixel_n_res: 1
  enable_pixel: true
  enable_context_pixel: false
  context_pixel_hidden: 896
  context_pixel_action_dim: 7
  context_pixel_task_dim: 2048
  context_pixel_residual_scale: 0.65
  context_pixel_use_action: true
  context_pixel_use_task: true
  context_pixel_predict_motion: true
  context_pixel_motion_blend_gain: 0.35
  enable_progress_head: false
  enable_action_proposer: false
  enable_action_policy: false
  enable_world_prior: false
  world_prior_hidden: 768
  world_prior_layers: 2
  world_prior_heads: 12
  world_prior_mlp_mult: 4
  world_prior_dropout: 0.0
  world_prior_task_dim: 2048
  world_prior_action_dim: 7
  world_prior_use_context: true
  world_prior_use_action: true
  world_prior_predict_initial: true
  enable_bridging: false
train:
  epochs: 4
  batch_size_per_gpu: 4
  num_workers: 4
  lr: 2.0e-05
  weight_decay: 0.02
  warmup_steps: 100
  grad_clip: 1.0
  precision: bf16
  log_every: 25
  ckpt_every_epochs: 1
  ckpt_every_steps: 250
  max_steps: 1500
  max_val_batches: 64
  find_unused_parameters: false
  manual_grad_sync: false
  direct_policy_only: false
  condition_dropout:
    enabled: false
    text_only_p: 0.0
    text_context_p: 0.0
    text_action_p: 0.0
    action_p: 0.0
    context_p: 0.0
  enable_pixel_loss: true
  enable_hunyuan_latent_loss: false
  enable_prior_hunyuan_latent_loss: false
  prior_hunyuan_latent_weight: 0.0
  prior_hunyuan_use_rough_rgb: true
  hunyuan_latent_weight: 0.0
  hunyuan_latent_mse_weight: 1.0
  hunyuan_latent_l1_weight: 0.1
  hunyuan_latent_temporal_weight: 0.2
  hunyuan_latent_motion_weight: 0.1
  hunyuan_adapter_hidden: 256
  hunyuan_adapter_blocks: 4
  hunyuan_latent_channels: 16
  hunyuan_latent_time: 3
  hunyuan_latent_hw: 32
  hunyuan_use_motion: true
  hunyuan_use_rough_rgb: true
  hunyuan_use_context: true
  hunyuan_use_action: true
  hunyuan_use_task: true
  hunyuan_detach_world: true
  hunyuan_residual_from_rough: true
  hunyuan_residual_scale: 0.5
  hunyuan_zero_init_output: false
  hunyuan_repo: /data/Minko/external/HunyuanVideo
  hunyuan_model_base: /data/Minko/models/hunyuan_video
  hunyuan_vae_precision: fp16
loss:
  cos: 0.1
  grip: 0.5
  geom_depth: 1.6
  depth_change: 0.05
  depth_motion_l1: 0.04
  depth_motion_gain: 3.0
  depth_temporal: 0.2
  depth_temporal_static_only: true
  depth_tv: 0.02
  geom_point: 0.15
  point_temporal: 0.05
  geom_pose: 0.04
  action: 0.05
  idm_reg: 0.0
  world_prior: 0.0
  world_prior_init: 0.5
  world_prior_future: 1.0
  world_prior_depth: 0.0
  world_prior_rgb_l1: 0.0
  world_prior_flow: 0.0
  rgb_l1: 0.2
  rgb_lpips: 0.05
  rgb_motion_l1: 0.0
  rgb_edge: 0.0
  rgb_motion_bce: 0.0
  rgb_motion_dice: 0.0
  rgb_motion_pos_weight: 2.0
  rgb_motion_threshold: 0.03
  progress: 0.0
  terminal_progress: 0.0
  plausibility: 0.0
  rgb_motion_gain: 3.0
out:
  root: /data/Minko/world_model/wm3d_v5/results/wm3d_v5_p64_140m_stage0_native3d_exp8192_w2_3node_v1
  tb_dir: tb
  ckpt_dir: ckpt
overfit_clip_ids: []
optimizer:
  type: adamw
  betas:
  - 0.9
  - 0.95
  weight_decay: 0.02
  grad_clip: 1.0
lr_schedule:
  type: wsd
  peak_lr: 2.0e-05
  min_lr: 2.0e-06
  warmup_steps: 100
  stable_frac: 0.80
  decay_frac: 0.20

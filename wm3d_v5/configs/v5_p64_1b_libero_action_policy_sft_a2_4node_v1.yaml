base_cfg: configs/v5_p64_1b_libero_action_policy_base_a2_v1.yaml
data:
  manifest:
  - /data/Minko/world_model/wm3d_v5/manifests/libero_action_policy_full_T16_k8_s4_v1_local.jsonl
  action_stats: /data/Minko/wm3d_v5_cache_local/libero_action_policy_full_T16_k8_s4_v1/action_stats.npz
  preload: false
  val_frac: 0.10
  seed: 260610
  plan_state_dim: 17
train:
  # A2: trunk-through action policy. Trunk fine-tuned at low lr, action_proj at
  # mid lr, the reactive policy at full lr. DDP across 4 nodes x 8 = 32 GPUs.
  init_ckpt: results/wm3d_v5_p64_1b_stage2_action_scaffold_native3d_wsd_4node_v1/ckpt/best.pt
  device: cuda:0
  batch_size: 8
  num_workers: 8
  max_steps: 6000
  eval_every: 200
  lr: 1.5e-4
  lr_multipliers:
    dual: 0.015
    action_proj: 0.05
    action_policy: 1.0
  weight_decay: 0.02
  warmup_steps: 300
  grad_clip: 1.0
  find_unused_parameters: true
  keep_eval_ckpts: false
  trainable_prefixes:
  - dual.
  - action_proj.
  - action_policy.
loss:
  pose_weight: 1.2
  first_pose_weight: 8.0
  delta_weight: 0.2
  grip_weight: 2.5
  grip_transition_weight: 18.0
  first_grip_weight: 4.0
  huber_delta: 0.5
out:
  root: /data/Minko/world_model/wm3d_v5/results/wm3d_v5_p64_1b_libero_action_policy_a2_4node_v1
  ckpt_dir: ckpt

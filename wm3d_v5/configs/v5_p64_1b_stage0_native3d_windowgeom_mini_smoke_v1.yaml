  action_proj_hidden: 1024
  action_proj_layers: 5
  geom_hidden: 512
  geom_upsample_mode: resize_conv
  enable_geom_extra: true
  pixel_hidden: 256
  pixel_n_res: 1
  enable_pixel: true
  enable_context_pixel: false
  context_pixel_hidden: 1536
  context_pixel_action_dim: 7
  context_pixel_task_dim: 2048

data:
  manifest: /data/Minko/world_model/wm3d_v5/manifests/droid_smoke64_cached_rgb_geom_v1.jsonl
  cache_root: /0604-10T-test/wm3d_v5/cache
  tokens_subdir: vggt_pooled
  action_stats: /0604-10T-test/wm3d_v5/cache/action_stats_oxe_droid20k_stage1_world_v1.npz
  require_task_emb: true
  load_rgb: true
  load_geom: true
  load_state_tgt: true
  load_geom_extra: true
  require_geom_extra: true
  window_geom_subdir: vggt_window_geom_p64_native3d_v5_mini
  use_window_tokens: true
  allow_pseudo_progress_targets: false
  T: 16
  k: 8
  stride: 4
  val_frac: 0.1
  seed: 917
  split:
    mode: random_window
    val_frac: 0.1
    seed: 917
model:
  state:
    T: 16
    P: 64
    D: 2048
    hidden: 1600
    n_layers: 18
    n_heads: 16
    k: 8
    action_cond_dim: 7
  action:
    T: 16
    P: 64
    D: 2048
    hidden: 1280
    n_layers: 14
    n_heads: 16
    k: 8
    z_dim: 224
    action_cond_dim: 7
  xattn_layers_state: [3, 6, 9, 12, 15, 17]

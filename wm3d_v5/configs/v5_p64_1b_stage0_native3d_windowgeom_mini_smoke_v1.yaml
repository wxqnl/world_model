  enable_action_proposer: false
  enable_action_policy: false
  enable_world_prior: false
  enable_bridging: false
train:
  epochs: 1
  max_steps: 3
  batch_size_per_gpu: 1
  num_workers: 0
  lr: 1.0e-05
  weight_decay: 0.02
  warmup_steps: 10
  grad_clip: 1.0
  precision: bf16
  log_every: 1
  ckpt_every_epochs: 1
  ckpt_every_steps: 0
  max_val_batches: 2
  find_unused_parameters: false
  manual_grad_sync: false
  direct_policy_only: false
  condition_dropout:
    enabled: false
    text_only_p: 0.0
    text_context_p: 0.0
    text_action_p: 0.0
    action_p: 0.0
    context_p: 0.0
  enable_pixel_loss: true
  enable_hunyuan_latent_loss: false
  enable_prior_hunyuan_latent_loss: false
  prior_hunyuan_latent_weight: 0.0
  hunyuan_latent_weight: 0.0
loss:
  cos: 0.1
  grip: 0.5
  geom_depth: 1.6
  depth_change: 0.05
  depth_motion_l1: 0.04
  depth_motion_gain: 3.0
  depth_temporal: 0.2
  depth_temporal_static_only: true
  depth_tv: 0.02
  geom_point: 0.15
  point_temporal: 0.05
  geom_pose: 0.04
  action: 0.05
  idm_reg: 0.0
  world_prior: 0.0
  world_prior_init: 0.5
  world_prior_future: 1.0
  world_prior_depth: 0.0
  world_prior_rgb_l1: 0.0
  world_prior_flow: 0.0
  rgb_l1: 0.2
  rgb_lpips: 0.05
  rgb_motion_l1: 0.0
  rgb_edge: 0.0
  rgb_motion_bce: 0.0
  rgb_motion_dice: 0.0
  rgb_motion_pos_weight: 2.0
  rgb_motion_threshold: 0.03
  progress: 0.0
  terminal_progress: 0.0
  plausibility: 0.0
  rgb_motion_gain: 3.0
out:
  root: /data/Minko/world_model/wm3d_v5/results/wm3d_v5_p64_1b_stage0_native3d_windowgeom_mini_smoke_v1
  tb_dir: tb
  ckpt_dir: ckpt
overfit_clip_ids: []
optimizer:
  type: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.02
  grad_clip: 1.0
lr_schedule:
  type: wsd
  peak_lr: 1.0e-05
  min_lr: 1.0e-06
  warmup_steps: 10
  stable_frac: 0.85
  decay_frac: 0.15

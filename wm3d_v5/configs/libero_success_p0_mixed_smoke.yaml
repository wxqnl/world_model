base_cfg: configs/v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce.yaml
data:
  manifest:
    - results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/system_eval_best/libero_expert_cache_smoke/manifest.jsonl
    - results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/system_eval_best/libero_failure_cache_smoke/manifest.jsonl
  action_stats: results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/system_eval_best/libero_expert_cache_smoke/action_stats.npz
  val_frac: 0.25
  seed: 3
train:
  init_ckpt: results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/ckpt/best.pt
  device: cuda:0
  batch_size: 4
  num_workers: 0
  max_steps: 30
  lr: 2.0e-4
  weight_decay: 0.02
  warmup_steps: 5
  grad_clip: 1.0
  trainable_prefixes:
    - progress_head.
    - action_proposer.
loss:
  terminal_weight: 0.5
  plausibility_weight: 0.0
  proposer_pose_weight: 1.0
  proposer_grip_weight: 0.2
  proposer_anchor_weight: 0.1
  candidate_ce_weight: 0.2
  candidate_pairwise_weight: 0.1
  candidate_ce_temperature: 0.1
  candidate_pairwise_margin: 0.05
  candidate_grip_weight: 0.1
  huber_delta: 1.0
out:
  root: results/wm3d_libero_success_p0_mixed_smoke_v1
  ckpt_dir: ckpt

<svg width="1400" height="900" viewBox="0 0 1400 900" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title { font: 700 34px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #111827; }
    .subtitle { font: 500 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #4b5563; }
    .card { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; rx: 16; ry: 16; }
    .section { font: 700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #111827; }
    .label { font: 600 16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #374151; }
    .text { font: 500 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #4b5563; }
    .value { font: 700 18px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #111827; }
    .small { font: 500 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill: #6b7280; }
    .ok { fill: #ecfdf5; stroke: #10b981; }
    .warn { fill: #fffbeb; stroke: #f59e0b; }
    .run { fill: #eff6ff; stroke: #3b82f6; }
  </style>

  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc"/>
  <text x="70" y="80" class="title">wm3d_v3 Recent Branch Updates</text>
  <text x="70" y="115" class="subtitle">2026-06-01 incremental review: context-motion, control-head, episode eval, Hunyuan backend interface</text>

  <rect x="70" y="160" width="1260" height="190" class="card"/>
  <text x="100" y="205" class="section">High-level interpretation</text>
  <text x="100" y="245" class="label">1. RGB diagnostic path improved, but gains are small.</text>
  <text x="100" y="275" class="text">Context-motion slightly improved RGB L1 / LPIPS and produced a useful motion mask, but it did not change the project’s ceiling.</text>
  <text x="100" y="315" class="label">2. Control-head is the more important direction.</text>
  <text x="100" y="345" class="text">It turns the world model into a structured-control predictor for a future Hunyuan/Wan renderer, instead of forcing the current RGB decoder to do everything.</text>

  <rect x="70" y="390" width="390" height="410" class="card ok"/>
  <text x="95" y="435" class="section">Branch A: context_motion</text>
  <text x="95" y="475" class="label">Main change</text>
  <text x="95" y="500" class="text">Added motion logit + motion-aware residual blending inside</text>
  <text x="95" y="523" class="text">`ContextResidualPixelDecoder`.</text>
  <text x="95" y="570" class="label">Status</text>
  <text x="95" y="595" class="value">Completed, best ckpt available</text>
  <text x="95" y="640" class="label">Best train val_total</text>
  <text x="95" y="665" class="value">0.2707</text>
  <text x="95" y="705" class="label">Episode eval (400 bridge windows)</text>
  <text x="95" y="730" class="text">RGB L1 0.01539 | LPIPS 0.07233 | motion L1 0.03939</text>
  <text x="95" y="770" class="small">Quick-split diagnostic over context-renderer:</text>
  <text x="95" y="792" class="small">RGB L1 0.02411 → 0.02354, LPIPS 0.10488 → 0.10238</text>

  <rect x="505" y="390" width="390" height="410" class="card ok"/>
  <text x="530" y="435" class="section">Branch B: control_head</text>
  <text x="530" y="475" class="label">Main change</text>
  <text x="530" y="500" class="text">Split structured controls out of the RGB decoder:</text>
  <text x="530" y="523" class="text">predict motion/contact/confidence maps from future tokens.</text>
  <text x="530" y="570" class="label">Status</text>
  <text x="530" y="595" class="value">Completed, best ckpt available</text>
  <text x="530" y="640" class="label">Best train val_total*</text>
  <text x="530" y="665" class="value">0.2209</text>
  <text x="530" y="705" class="label">Episode eval (400 bridge windows)</text>
  <text x="530" y="730" class="text">RGB L1 0.01538 | LPIPS 0.06977 | motion L1 0.03975</text>
  <text x="530" y="770" class="small">Important: this branch aligns better with the planned</text>
  <text x="530" y="792" class="small">VideoConditionBundle → Hunyuan renderer direction.</text>

  <rect x="940" y="390" width="390" height="410" class="card run"/>
  <text x="965" y="435" class="section">Branch C: control_head_v2_256</text>
  <text x="965" y="475" class="label">Main change</text>
  <text x="965" y="500" class="text">Higher-resolution control maps with refine stage:</text>
  <text x="965" y="523" class="text">256x256 output, `fuse_size=64`, `use_refine=true`.</text>
  <text x="965" y="570" class="label">Status</text>
  <text x="965" y="595" class="value">Training in progress</text>
  <text x="965" y="640" class="label">Current observed best</text>
  <text x="965" y="665" class="value">epoch 0, val_total 0.2486</text>
  <text x="965" y="705" class="label">Read as</text>
  <text x="965" y="730" class="text">promising follow-up, not evidence yet.</text>
  <text x="965" y="770" class="small">* `val_total` numbers across branches are not fully</text>
  <text x="965" y="792" class="small">comparable because split/eval protocol changed.</text>

  <rect x="70" y="825" width="1260" height="45" class="card warn"/>
  <text x="95" y="853" class="small">Current review risks: action-sensitivity reproducibility gap for old control-head ckpt under current config, DDP `find_unused_parameters=true` overhead, and stray `._*` AppleDouble files in the repo tree.</text>
</svg>

    - results/wm3d_libero_teacher_cache_task1_transformer50_rich_future_v2/manifest.jsonl
    - results/wm3d_libero_intervention_v3_teacher_from120_suffix_cache/manifest.jsonl
  plan_state_dim: 17
  action_stats: /data/Minko/datasets/cache/wm3d_v3/action_stats.npz

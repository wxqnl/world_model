base_cfg: configs/v3_p64_140m_actioncond_context_motion_p0_heads_direct_policy_lowdimhist.yaml
data:
  manifest:
    - results/wm3d_libero_action_policy_direct_partial4_dense_v1/task1_demo0_start_stride1_cache/manifest.jsonl
  action_stats: results/wm3d_libero_action_policy_direct_partial4_dense_v1/task1_demo0_start_stride1_cache/action_stats.npz
  preload: true
  val_frac: 0.05
  seed: 3
train:
  init_ckpt: results/wm3d_libero_action_bc_anchor_partial4_v1/ckpt/best.pt
  device: cuda:0
  batch_size: 128
  num_workers: 0
  max_steps: 1000
  eval_every: 100
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 50
  grad_clip: 1.0
  trainable_prefixes:
    - action_policy.
loss:
  pose_weight: 1.0
  first_pose_weight: 4.0
  delta_weight: 0.3
  grip_weight: 0.4
  first_grip_weight: 1.0
  huber_delta: 1.0
out:
  root: results/wm3d_libero_action_policy_lowdimhist_task1_demo0_overfit_v1
  ckpt_dir: ckpt

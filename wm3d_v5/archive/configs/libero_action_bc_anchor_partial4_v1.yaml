base_cfg: configs/v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce.yaml
data:
  manifest:
    - results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/system_eval_best/libero_expert_cache_partial4_256/manifest.jsonl
  action_stats: results/wm3d_v3_p64_140m_actioncond_context_motion_p0_heads_candrank_ce_v1/system_eval_best/libero_expert_cache_partial4_256/action_stats.npz
  val_frac: 0.15
  seed: 21
train:
  init_ckpt: results/wm3d_libero_success_p0_partial4_mixed_v1/ckpt/best.pt
  device: cuda:0
  batch_size: 8
  num_workers: 2
  max_steps: 500
  lr: 1.0e-4
  weight_decay: 0.02
  warmup_steps: 30
  grad_clip: 1.0
  trainable_prefixes:
    - action_proposer.
loss:
  terminal_weight: 0.0
  plausibility_weight: 0.0
  proposer_pose_weight: 0.5
  proposer_grip_weight: 0.1
  proposer_anchor_weight: 3.0
  proposer_anchor_grip_weight: 1.0
  proposer_anchor_first_pose_weight: 5.0
  proposer_anchor_first_grip_weight: 2.0
  candidate_ce_weight: 0.0
  candidate_pairwise_weight: 0.0
  candidate_ce_temperature: 0.1
  candidate_pairwise_margin: 0.05
  candidate_grip_weight: 0.1
  huber_delta: 1.0
out:
  root: results/wm3d_libero_action_bc_anchor_partial4_v1
  ckpt_dir: ckpt

data:
  manifest: /home/user01/Minko/newwm/wm3d_v3/manifests/oxe_train.jsonl
  cache_root: /home/user01/Minko/datasets/cache/wm3d_v3
  action_stats: /home/user01/Minko/datasets/cache/wm3d_v3/action_stats.npz
  T: 16
  k: 8
  stride: 4
  val_frac: 0.05
  seed: 0

model:
  state: { T: 16, P: 64, D: 2048, hidden: 1152, n_layers: 14, n_heads: 16, k: 8 }
  idm:   { T: 16, k: 8, P: 64, D: 2048, hidden: 896, n_layers: 10, n_heads: 14, z_dim: 192, cond_dim: 2048 }
  action_proj_hidden: 1024
  action_proj_layers: 5
  geom_hidden: 384
  pixel_hidden: 768
  pixel_n_res: 2
  enable_pixel: false

train:
  epochs: 15
  batch_size_per_gpu: 8
  num_workers: 4
  lr: 1.5e-4
  weight_decay: 0.02
  warmup_steps: 1500
  grad_clip: 1.0
  log_every: 50
  ckpt_every_epochs: 1

loss:
  action_pose: 10.0
  action_grip: 2.0
  aux_idm: 0.0
  grip_pos_weight: 1.0
  grip_focal_alpha: 0.25
  grip_focal_gamma: 2.0
  huber_delta: 1.0

out:
  root: /home/user01/Minko/newwm/results/wm3d_v3_vla_b
  tb_dir: tb
  ckpt_dir: ckpt

data:
  manifest: /home/user01/Minko/newwm/wm3d_v3/manifests/oxe_train.jsonl
  cache_root: /home/user01/Minko/datasets/cache/wm3d_v3
  T: 16
  k: 8
  stride: 4
  val_frac: 0.05
  seed: 0
model:
  state:  { T: 16, P: 64, D: 2048, hidden: 1152, n_layers: 14, n_heads: 16, k: 8 }
  action: { T: 16, P: 64, D: 2048, hidden:  896, n_layers: 10, n_heads: 14, k: 8, z_dim: 192 }
  xattn_layers_state: [3, 6, 9, 11, 13]
  xattn_n_heads: 16
  action_proj_hidden: 768
  action_proj_layers: 5
  geom_hidden: 384
  pixel_hidden: 1536   # matches v3.5 ckpt
  pixel_n_res: 2
  enable_bridging: true
train:
  epochs: 15
  batch_size_per_gpu: 4
  num_workers: 4
  lr: 5.0e-5             # half of v3.5's 1e-4 since we're fine-tuning everything
  weight_decay: 0.02
  warmup_steps: 500
  grad_clip: 0.5         # safer for end-to-end
  precision: bf16
  log_every: 50
  ckpt_every_epochs: 99  # disable mid-saves; only best.pt updates (disk is tight)
loss:
  cos: 0.1
  grip: 0.5
  geom_depth: 0.3
  geom_point: 0.05
  geom_pose: 0.02
  action: 1.0
  idm_reg: 0.01
  rgb_l1: 1.0
  rgb_lpips: 0.5
out:
  root: /home/user01/Minko/newwm/results/wm3d_v3_5_e2e
  tb_dir: tb
  ckpt_dir: ckpt

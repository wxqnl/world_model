data:
  manifest: /home/user01/Minko/newwm/wm3d_v3/manifests/oxe_train.jsonl
  cache_root: /home/user01/Minko/datasets/cache/wm3d_v3
  action_stats: /home/user01/Minko/datasets/cache/wm3d_v3/action_stats.npz
  T: 16
  k: 8
  stride: 4
  val_frac: 0.05
  seed: 0

model:
  state:  { T: 16, P: 64, D: 2048, hidden: 1152, n_layers: 14, n_heads: 16, k: 8 }
  action: { T: 16, P: 64, D: 2048, hidden:  896, n_layers: 10, n_heads: 14, k: 8, z_dim: 192 }
  xattn_layers_state: [3, 6, 9, 11, 13]
  xattn_n_heads: 16
  action_proj_hidden: 1024
  action_proj_layers: 5
  geom_hidden: 384
  pixel_hidden: 768
  pixel_n_res: 2
  enable_pixel: true        # built so warm-start ckpt loads, but pixel loss disabled
  enable_bridging: true
  enable_aux_idm: true
  aux_idm_hidden: 1024
  aux_idm_layers: 3

train:
  epochs: 10
  batch_size_per_gpu: 8
  num_workers: 4
  lr: 5.0e-5
  weight_decay: 0.02
  warmup_steps: 500
  grad_clip: 1.0
  log_every: 50
  ckpt_every_epochs: 1
  freeze_phase1_until_epoch: 3
  freeze_phase1_prefixes:
    [pixel., geom., bridging., dual.state, dual.action, dual.xattn_blocks, dual.action_up, dual.action_down]
  freeze_phase2_prefixes:
    [pixel., geom., bridging., dual.state]

loss:
  action_pose: 10.0
  action_grip: 2.0
  aux_idm: 5.0
  grip_pos_weight: 1.0
  grip_focal_alpha: 0.25
  grip_focal_gamma: 2.0
  huber_delta: 1.0

warm_start: /home/user01/Minko/newwm/results/wm3d_v3/ckpt/best.pt

out:
  root: /home/user01/Minko/newwm/results/wm3d_v3_vla
  tb_dir: tb
  ckpt_dir: ckpt

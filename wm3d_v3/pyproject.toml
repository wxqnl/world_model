[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wm3d_v3"
version = "0.1.0"
description = "Joint end-to-end world model + VLA on OXE real data, with Cosmos LoRA"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.7",
  "torchvision",
  "transformers>=4.49",
  "peft>=0.14",
  "accelerate",
  "numpy",
  "pyarrow",
  "pyyaml",
  "tensorboard",
  "tqdm",
  "einops",
  "av",
  "pillow",
  "imageio",
  "lpips",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["wm3d_v3*"]

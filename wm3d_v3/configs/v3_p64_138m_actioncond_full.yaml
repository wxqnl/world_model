data:
  manifest: /data/Minko/world_model/wm3d_v3/manifests/oxe_train.jsonl
  cache_root: /data/Minko/datasets/cache/wm3d_v3
  tokens_subdir: vggt_pooled
  action_stats: /data/Minko/datasets/cache/wm3d_v3/action_stats.npz
  T: 16
  k: 8
  stride: 4
  val_frac: 0.05
  seed: 0
model:
  state:  { T: 16, P: 64, D: 2048, hidden: 512, n_layers: 6, n_heads: 8, k: 8, action_cond_dim: 7 }
  action: { T: 16, P: 64, D: 2048, hidden: 384, n_layers: 4, n_heads: 8, k: 8, z_dim: 128, action_cond_dim: 7 }
  xattn_layers_state: [1, 3, 5]
  xattn_n_heads: 8
  action_proj_hidden: 384
  action_proj_layers: 3
  geom_hidden: 192
  pixel_hidden: 1024
  pixel_n_res: 2
  enable_pixel: true
  enable_bridging: false
train:
  epochs: 40
  batch_size_per_gpu: 8
  num_workers: 4
  lr: 2.0e-4
  weight_decay: 0.02
  warmup_steps: 2000
  grad_clip: 1.0
  precision: bf16
  log_every: 50
  ckpt_every_epochs: 2
loss:
  cos: 0.1
  grip: 0.5
  geom_depth: 0.3
  geom_point: 0.05
  geom_pose: 0.02
  action: 1.0
  idm_reg: 0.01
  rgb_l1: 1.0
  rgb_lpips: 0.5
out:
  root: /data/Minko/world_model/wm3d_v3/results/wm3d_v3_p64_138m_actioncond_full
  tb_dir: tb
  ckpt_dir: ckpt
overfit_clip_ids: []

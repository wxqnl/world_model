data:
  manifest: /data/Minko/world_model/wm3d_v3/manifests/oxe_train.jsonl
  cache_root: /data/Minko/datasets/cache/wm3d_v3
  tokens_subdir: vggt_pooled
  action_stats: /data/Minko/datasets/cache/wm3d_v3/action_stats.npz
  T: 16
  k: 8
  stride: 4
  val_frac: 0.05
  seed: 0
model:
  state:  { T: 16, P: 64, D: 2048, hidden: 512, n_layers: 6, n_heads: 8, k: 8, action_cond_dim: 7 }
  action: { T: 16, P: 64, D: 2048, hidden: 384, n_layers: 4, n_heads: 8, k: 8, z_dim: 128, action_cond_dim: 7 }
  xattn_layers_state: [1, 3, 5]
  xattn_n_heads: 8
  action_proj_hidden: 384
  action_proj_layers: 3
  geom_hidden: 192
  enable_geom_extra: false
  pixel_hidden: 1024
  pixel_n_res: 2
  enable_pixel: true
  enable_context_pixel: true
  context_pixel_hidden: 896
  context_pixel_action_dim: 7
  context_pixel_task_dim: 2048
  context_pixel_residual_scale: 0.75
  context_pixel_use_action: true
  context_pixel_use_task: true
  context_pixel_predict_motion: true
  context_pixel_motion_blend_gain: 0.5
  enable_bridging: false
train:
  epochs: 8
  batch_size_per_gpu: 11
  num_workers: 6
  lr: 1.5e-4
  weight_decay: 0.02
  warmup_steps: 800
  grad_clip: 1.0
  precision: bf16
  log_every: 50
  ckpt_every_epochs: 2
  find_unused_parameters: false
loss:
  cos: 0.1
  grip: 0.5
  geom_depth: 0.3
  geom_point: 0.05
  geom_pose: 0.02
  action: 1.0
  idm_reg: 0.01
  rgb_l1: 1.0
  rgb_lpips: 0.5
  rgb_motion_l1: 1.5
  rgb_edge: 0.1
  rgb_motion_bce: 0.05
  rgb_motion_dice: 0.05
  rgb_motion_pos_weight: 2.0
  rgb_motion_threshold: 0.03
  rgb_motion_gain: 4.0
out:
  root: /data/Minko/world_model/wm3d_v3/results/wm3d_v3_p64_140m_actioncond_context_motion
  tb_dir: tb
  ckpt_dir: ckpt
overfit_clip_ids: []

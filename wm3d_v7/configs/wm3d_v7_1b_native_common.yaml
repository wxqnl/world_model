model:
  state:
    T: 16
    P: 64
    D: 2048
    hidden: 1600
    n_layers: 18
    n_heads: 16
    k: 8
    action_cond_dim: 7
  action:
    T: 16
    P: 64
    D: 2048
    hidden: 1280
    n_layers: 14
    n_heads: 16
    k: 8
    z_dim: 224
    action_cond_dim: 7
  xattn_layers_state: [3, 6, 9, 12, 15, 17]
  xattn_n_heads: 16
  enable_multiview_fuser: true
  multiview_heads: 16
  multiview_dropout: 0.0
  multiview_use_camera_pose: false
  enable_token_codec: true
  token_codec_latent_dim: 384
  token_codec_checkpoint: /data/Minko/world_model/wm3d_v7/manifests/token_codec/pca384_int8_strict_v2.pt
  action_proj_hidden: 1024
  action_proj_layers: 5
  geom_hidden: 512
  geom_upsample_mode: resize_conv
  enable_geom_extra: true
  pixel_hidden: 1024
  pixel_n_res: 2
  enable_pixel: false
  enable_context_pixel: false
  enable_progress_head: false
  enable_future_value: false
  enable_action_proposer: false
  enable_action_policy: false
  enable_world_prior: false
  enable_bridging: false

train:
  epochs: 1000
  batch_size_per_gpu: 1
  num_workers: 2
  lr: 1.0e-5
  weight_decay: 0.02
  warmup_steps: 500
  min_lr_ratio: 0.1
  grad_clip: 1.0
  precision: bf16
  measure_step_time: true
  log_every: 20
  grad_probe_every: 0
  ckpt_every_epochs: 1000
  ckpt_every_steps: 2000
  keep_last_checkpoints: 3
  save_best_checkpoint: false
  abort_on_nonfinite: true
  max_steps: 60000
  max_val_batches: 32
  validate_every_epochs: 1000
  find_unused_parameters: false
  fsdp_enabled: false
  manual_grad_sync: false
  direct_policy_only: false
  future_value_only: false
  condition_dropout:
    enabled: false
    text_only_p: 0.0
    text_context_p: 0.0
    text_action_p: 0.0
    action_p: 0.0
    context_p: 0.0
  enable_pixel_loss: false
  enable_hunyuan_latent_loss: false
  hunyuan_latent_weight: 0.0
  prior_hunyuan_latent_weight: 0.0
  evaluator_pairwise_weight: 0.0
  evaluator_candidate_pairwise_weight: 0.0
  evaluator_candidate_ce_weight: 0.0
  context_pixel_action_rank_weight: 0.0
  context_pixel_action_separation_weight: 0.0
  direct_policy_weight: 0.0
  policy_flow_weight: 0.0
  true_branch_weight: 0.0
  true_branch_reconstruction_weight: 1.0
  true_branch_matching_weight: 1.0
  future_value_weight: 0.0

loss:
  cos: 0.1
  grip: 0.5
  geom_depth: 1.6
  depth_temporal: 0.2
  depth_temporal_static_only: false
  depth_tv: 0.02
  geom_point: 0.15
  point_temporal: 0.05
  geom_pose: 0.04
  action: 0.05
  idm_reg: 0.0
  rgb_l1: 0.0
  rgb_lpips: 0.0

optimizer:
  type: adamw
  betas: [0.9, 0.95]
  weight_decay: 0.02
  grad_clip: 1.0
  peak_lr: 1.0e-5
  min_lr: 1.0e-6

lr_schedule:
  type: wsd
  peak_lr: 1.0e-5
  min_lr: 1.0e-6
  warmup_steps: 500
  stable_frac: 0.8
  decay_frac: 0.2

out:
  root: /data/Minko/world_model/wm3d_v7/results/override_required
  tb_dir: tb
  ckpt_dir: ckpt

overfit_clip_ids: []

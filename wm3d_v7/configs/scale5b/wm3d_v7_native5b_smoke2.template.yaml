schema: wm3d_v7_native5b_pretrain_config_v1

# 两张 80GB GPU 的软件链路验证。模型主干和 T24/P144/K16/D2048 接口
# 与正式 5B 一致；只缩短步数并只解码一个 RGB 帧，不代表训练质量。
run:
  name: __MATERIALIZE_REQUIRED__
  run_lineage: __MATERIALIZE_REQUIRED__
  output_root: __MATERIALIZE_REQUIRED__
  code_receipt_path: __MATERIALIZE_REQUIRED__
  code_receipt_sha256: __MATERIALIZE_REQUIRED__
  environment_contract_path: __MATERIALIZE_REQUIRED__
  environment_contract_sha256: __MATERIALIZE_REQUIRED__
  environment_receipt_path: __MATERIALIZE_REQUIRED__
  environment_receipt_sha256: __MATERIALIZE_REQUIRED__
  training_contract_sha256: __MATERIALIZE_REQUIRED__

model:
  T: 24
  P: 144
  K: 16
  token_dim: 2048
  task_dim: 2048
  num_views: 3
  state_hidden: 2560
  state_layers: 32
  state_heads: 20
  state_ff_mult: 2.5
  action_hidden: 2048
  action_layers: 24
  action_heads: 16
  action_ff_mult: 2.6666666666666665
  bridge_layers_state: [2, 5, 8, 11, 14, 17, 20, 23, 26, 29]
  bridge_heads: 16
  view_hidden: 1024
  view_heads: 8
  view_ff_mult: 2.5
  max_action_groups: 8
  max_action_dim: 16
  action_substeps: 6
  max_group_id: 64
  max_embodiments: 256
  memory_dim: 2048
  memory_every_state_layers: 4
  max_aux_tokens: 8
  aux_dim: 256
  max_aux_type_id: 64
  rgb_hidden: 512
  rgb_size: 384
  rgb_decode_indices: [15]
  geom_hidden: 768
  dropout: 0.0
  activation_checkpointing: true

data:
  root: __MATERIALIZE_REQUIRED__
  contract: __MATERIALIZE_REQUIRED__
  contract_sha256: __MATERIALIZE_REQUIRED__
  seal_receipt: __MATERIALIZE_REQUIRED__
  seal_receipt_sha256: __MATERIALIZE_REQUIRED__
  source_order: []
  source_weights: {}
  memory_slots: 2
  memory_stride_frames: 25
  row_group_cache_size: 2
  task_cache_size: 64
  num_workers: 1
  persistent_workers: false
  prefetch_factor: 2
  minimum_free_bytes: 50000000000

distributed:
  expected_world_size: 2
  shard_degree: 2
  minimum_shm_bytes: 1000000000
  minimum_output_free_bytes: 50000000000
  minimum_ib_rate_gbps: 0.0
  minimum_allreduce_gbps: 0.0

optimizer:
  peak_lr: 0.00001
  min_lr: 0.00001
  betas: [0.9, 0.95]
  eps: 0.00000001
  weight_decay: 0.1

schedule:
  warmup_steps: 0
  stable_fraction: 0.8

train:
  total_steps: 1
  global_batch_size: 2
  micro_batch_size: 1
  gradient_accumulation: 1
  seed: 271828
  validation_seed: 314159
  gradient_clip: 1.0
  log_every: 1
  validation_steps: 1
  validate_every: 1
  checkpoint_steps: [1]
  checkpoint_interval: 0

loss:
  token_mse: 1.0
  token_cosine: 0.1
  rgb_charbonnier: 2.0
  rgb_gradient: 0.5
  rgb_laplacian: 0.2
  depth_log: 1.5
  depth_gradient: 0.25
  point: 0.5
  geometry_confidence: 0.1
  camera_pose: 0.1
  action_nll: 2.0
  action_velocity: 0.3
  action_contact: 0.4
  action_log_scale_reg: 0.0001
  epsilon: 0.000001

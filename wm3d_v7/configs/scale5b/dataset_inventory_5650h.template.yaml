    embodiment_id: 0
    views: [head, left_hand, right_hand]
    action_groups:
      - name: arm
        group_id: 0
        dimensions: [x, y, z, roll, pitch, yaw]
        rate_hz: 30.0
        control_mode: delta_pose
      - name: gripper
        group_id: 1
        dimensions: [close]
        rate_hz: 30.0
        control_mode: discrete_gripper
    auxiliary_modalities: []
  - name: agibot_wholebody
    embodiment_id: 1
    views: [head, left_hand, right_hand]
    action_groups:
      - name: left_arm
        group_id: 2
        dimensions: [j0, j1, j2, j3, j4, j5, j6]
